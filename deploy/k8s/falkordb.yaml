apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: falkordb-data
  namespace: novamem
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: falkordb
  namespace: novamem
spec:
  serviceName: falkordb
  replicas: 1
  selector:
    matchLabels: { app: falkordb }
  template:
    metadata:
      labels: { app: falkordb }
    spec:
      containers:
        - name: falkordb
          image: falkordb/falkordb:v4.18.3
          ports:
            - { containerPort: 6379, name: redis }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            tcpSocket: { port: redis }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 1000m, memory: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: falkordb-data
---
apiVersion: v1
kind: Service
metadata:
  name: falkordb
  namespace: novamem
spec:
  selector: { app: falkordb }
  ports:
    - { port: 6379, targetPort: redis }
