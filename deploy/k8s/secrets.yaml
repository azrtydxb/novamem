# TEMPLATE — DO NOT COMMIT REAL VALUES.
#
# This file is a placeholder so `kubectl apply -k deploy/k8s/` has a Secret
# resource to bind to. The values below are intentionally non-functional
# (`CHANGE_ME`). Replace them out-of-band using one of:
#
#   1. `kubectl create secret generic novamem-secrets -n novamem \
#          --from-literal=NOVAMEM_COOKIE_SECRET="$(openssl rand -hex 32)" \
#          --from-literal=NOVAMEM_BOOTSTRAP_ADMIN_EMAIL=admin@example.com \
#          --from-literal=NOVAMEM_BOOTSTRAP_ADMIN_PASSWORD="$(openssl rand -base64 24)" \
#          --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 24)"`
#      (and remove this file from the kustomization, or `kubectl apply` it
#      separately so the literal placeholders never reach the cluster).
#
#   2. Sealed Secrets (`kubeseal`) — encrypt this Secret manifest into a
#      `SealedSecret` that's safe to commit; the controller decrypts it
#      in-cluster.
#
#   3. external-secrets-operator — sync from Vault / AWS Secrets Manager /
#      GCP Secret Manager / Azure Key Vault using an `ExternalSecret` CR.
#
# Anything you paste here ends up in git history. See
# `docs/install/kubernetes.md` for the recommended workflow.
apiVersion: v1
kind: Secret
metadata:
  name: novamem-secrets
  namespace: novamem
type: Opaque
stringData:
  # Cookie signing secret — `openssl rand -hex 32`. Rotating invalidates
  # all existing sessions, by design.
  NOVAMEM_COOKIE_SECRET: "CHANGE_ME"
  # First-login bootstrap admin credentials. Auto-scrubbed from process.env
  # after the seed runs. Operator changes via the dashboard's first-login
  # password-change flow.
  NOVAMEM_BOOTSTRAP_ADMIN_EMAIL: "CHANGE_ME"
  NOVAMEM_BOOTSTRAP_ADMIN_PASSWORD: "CHANGE_ME"
  # Postgres password — must match what postgres.yaml mounts as
  # POSTGRES_PASSWORD on the StatefulSet.
  POSTGRES_PASSWORD: "CHANGE_ME"
  # Full Postgres DSN consumed by the app. Kept in the Secret (not the
  # ConfigMap) so the embedded password isn't readable by anyone with
  # `get configmaps` in the namespace. Format:
  #   postgres://novamem:<POSTGRES_PASSWORD>@postgres.novamem.svc.cluster.local:5432/novamem
  NOVAMEM_WARM_URL: "CHANGE_ME"
