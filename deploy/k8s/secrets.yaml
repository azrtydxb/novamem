apiVersion: v1
kind: Secret
metadata:
  name: novamem-secrets
  namespace: novamem
type: Opaque
stringData:
  # Cookie signing secret. Production should rotate this — anything that
  # touches existing sessions invalidates them, by design.
  NOVAMEM_COOKIE_SECRET: "k3s-248-cookie-secret-rotate-me-32chars-min"
  # First-login bootstrap admin credentials. Auto-scrubbed from process.env
  # after the seed runs. Operator changes via the dashboard's first-login
  # password-change flow.
  NOVAMEM_BOOTSTRAP_ADMIN_EMAIL: admin@example.com
  NOVAMEM_BOOTSTRAP_ADMIN_PASSWORD: "Jbz49teq01!"
  # Postgres password.
  POSTGRES_PASSWORD: "novamempg"
