apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-data
  namespace: novamem
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: novamem
spec:
  serviceName: qdrant
  replicas: 1
  selector:
    matchLabels: { app: qdrant }
  template:
    metadata:
      labels: { app: qdrant }
    spec:
      containers:
        - name: qdrant
          # Pin to v1.12.x to match the @qdrant/js-client-rest 1.12 the
          # server uses; major-version drift triggers a "client version
          # incompatible" warning and can break point ops.
          image: qdrant/qdrant:v1.12.4
          ports:
            - { containerPort: 6333, name: http }
          volumeMounts:
            - { name: data, mountPath: /qdrant/storage }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 1000m, memory: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: qdrant-data
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: novamem
spec:
  selector: { app: qdrant }
  ports:
    - { port: 6333, targetPort: http }
