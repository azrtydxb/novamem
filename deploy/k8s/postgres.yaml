apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: novamem
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: novamem
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          # For NOVAMEM_COLD_PROVIDER=pgvector use a pgvector-enabled
          # image (pgvector/pgvector:pg16 — same major, data-compatible)
          # AND mount a memory-backed emptyDir at /dev/shm: Kubernetes'
          # 64MB default breaks parallel index maintenance with
          # "could not resize shared memory segment" (dsm_impl_posix).
          # Size it WELL below the container memory limit — the mount
          # counts against it. Example:
          #   volumes:       [{name: dshm, emptyDir: {medium: Memory, sizeLimit: 512Mi}}]
          #   volumeMounts:  [{name: dshm, mountPath: /dev/shm}]
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: novamem
            - name: POSTGRES_DB
              value: novamem
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: novamem-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - { containerPort: 5432, name: pg }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "novamem"]
            initialDelaySeconds: 5
            periodSeconds: 5
          # pgvector deployments: measured with pgbench (persistent
          # connections) on a 380k-vector corpus with per-partition HNSW
          # indexes, one k=200 query runs ~8-10ms and 8 concurrent run
          # ~20ms each — a single core absorbs moderate concurrent search
          # comfortably. Two sizing notes that DO matter:
          #   - raise shared_buffers past its 128MB default, e.g.
          #     args: ["-c", "shared_buffers=1GB", "-c", "effective_cache_size=6GB"]
          #     so the hot index pages stay resident;
          #   - if you diagnose CPU throttling (cgroup v2: growing
          #     throttled_usec in /sys/fs/cgroup/cpu.stat; v1:
          #     throttled_time in /sys/fs/cgroup/cpu/cpu.stat), measure
          #     from a REMOTE client with persistent connections
          #     (pgbench). Forked psql loops inside the pod throttle the
          #     limit with their own startup cost and implicate the
          #     database falsely — that mistake shipped in an earlier
          #     version of this comment.
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 1000m, memory: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: novamem
spec:
  selector: { app: postgres }
  ports:
    - { port: 5432, targetPort: pg }
