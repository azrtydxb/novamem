apiVersion: v1
kind: ConfigMap
metadata:
  name: novamem-config
  namespace: novamem
data:
  NOVAMEM_AUTH_MODE: "user"
  NOVAMEM_ADMIN_DASHBOARD: "1"
  NOVAMEM_HOST: "0.0.0.0"
  NOVAMEM_PORT: "7778"
  # Public-facing URL the dashboard SPA reaches the API on. Better Auth
  # uses this for trusted-origin / CSRF checks — it must match the
  # browser's `Origin:` header exactly. Set to your TLS-terminated origin
  # (the Ingress hostname, not the Service IP).
  NOVAMEM_BASE_URL: "https://novamem.example.com"
  # The Go server NEVER embeds a model in process — `local-transformers`
  # is refused at startup by design (it would cost the single static
  # binary). Point these at any OpenAI-compatible endpoint: vLLM, TEI,
  # llama.cpp, LiteLLM, or a hosted API.
  NOVAMEM_EMBEDDINGS_PROVIDER: "openai-compatible"
  NOVAMEM_EMBEDDINGS_ENDPOINT: "http://your-inference-host/v1"
  NOVAMEM_EMBEDDINGS_MODEL: "bge-m3"
  # MUST match the model's output width, and MUST equal
  # NOVAMEM_COLD_VECTOR_SIZE below — bge-m3 is 1024, the default is 384.
  # A mismatch is not caught until the first write, which then fails with
  # `expected N dimensions, not M` once per entry.
  NOVAMEM_EMBEDDINGS_DIM: "1024"
  NOVAMEM_COLD_VECTOR_SIZE: "1024"
  # Optional subsystems, each off unless its _ENABLED is set and each
  # refusing to start without both an endpoint and a model. Rerank was
  # worth +21.2pp on LongMemEval, so it is the one to turn on first.
  #
  # NOTE the rerank endpoint is a FULL URL — no path is appended, unlike
  # the others (which get /embeddings and /chat/completions). Pointing it
  # at a bare /v1 yields 404 on every call.
  NOVAMEM_RERANK_ENABLED: "0"
  NOVAMEM_RERANK_ENDPOINT: "http://your-inference-host/v1/rerank"
  NOVAMEM_RERANK_MODEL: "bge-reranker-v2-m3"
  NOVAMEM_EXTRACTION_ENABLED: "0"
  NOVAMEM_EXTRACTION_ENDPOINT: "http://your-inference-host/v1"
  NOVAMEM_EXTRACTION_MODEL: "your-llm"
  NOVAMEM_OBSERVER_ENABLED: "0"
  NOVAMEM_OBSERVER_ENDPOINT: "http://your-inference-host/v1"
  NOVAMEM_OBSERVER_MODEL: "your-llm"
  NOVAMEM_QUERY_DECOMP_ENABLED: "0"
  NOVAMEM_QUERY_DECOMP_ENDPOINT: "http://your-inference-host/v1"
  NOVAMEM_QUERY_DECOMP_MODEL: "your-llm"
  # NOVAMEM_WARM_URL has moved to the Secret (it embeds the Postgres
  # password). See secrets.yaml.
  # Vector backend. Default: qdrant (below). To run pgvector instead:
  #   1. set NOVAMEM_COLD_PROVIDER: "pgvector"
  #   2. REMOVE or change NOVAMEM_COLD_URL — if it still points at Qdrant,
  #      the pgvector store will try to speak Postgres to it and every
  #      pod will fail readiness. Unset, it falls back to the warm DB.
  #   3. use a pgvector-enabled postgres image and give the pod a real
  #      /dev/shm — see the comments in postgres.yaml.
  NOVAMEM_COLD_URL: "http://qdrant.novamem.svc.cluster.local:6333"
  # TLS is terminated at the Ingress (see ingress.yaml), so cookies must
  # carry the Secure flag. Leave at "0" in production.
  NOVAMEM_INSECURE_COOKIES: "0"
  LOG_LEVEL: "info"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: novamem
  namespace: novamem
spec:
  replicas: 1
  selector:
    matchLabels: { app: novamem }
  strategy:
    type: Recreate
  template:
    metadata:
      labels: { app: novamem }
    spec:
      containers:
        - name: novamem
          # Multi-arch image published from CI on every main push (the Go
          # server, built from go/Dockerfile). The `:main` tag is mutable,
          # so `kubectl rollout restart deploy/novamem` pulls the latest —
          # but prefer pinning `:sha-<short>`: a mutable tag can be served
          # stale by a node's registry cache, which is exactly how one
          # replica came up on an older build during the Go cutover.
          image: ghcr.io/azrtydxb/novamem:main
          imagePullPolicy: Always
          envFrom:
            - configMapRef: { name: novamem-config }
            - secretRef: { name: novamem-secrets }
          ports:
            - { containerPort: 7778, name: http }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: 2000m, memory: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: novamem
  namespace: novamem
spec:
  # ClusterIP — the Service is fronted by the Ingress in ingress.yaml,
  # which terminates TLS. Don't expose this directly via LoadBalancer:
  # the app speaks plain HTTP and credentials/cookies must not travel
  # unencrypted on a node IP.
  type: ClusterIP
  selector: { app: novamem }
  ports:
    - { port: 7778, targetPort: http }
