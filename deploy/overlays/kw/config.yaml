# Preserve the kw inference settings; replace template defaults completely.
- op: replace
  path: /data
  value:
    LOG_LEVEL: info
    NOVAMEM_ADMIN_DASHBOARD: "1"
    NOVAMEM_AUTH_MODE: user
    NOVAMEM_BASE_URL: https://novamem.kw.watteel.lab
    NOVAMEM_COLD_URL: http://qdrant.novamem.svc.cluster.local:6333
    NOVAMEM_COLD_VECTOR_SIZE: "1024"
    NOVAMEM_EMBEDDINGS_DIM: "1024"
    NOVAMEM_EMBEDDINGS_ENDPOINT: http://192.168.10.125:4000/v1
    NOVAMEM_EMBEDDINGS_MODEL: bge-m3
    NOVAMEM_EMBEDDINGS_PROVIDER: openai-compatible
    NOVAMEM_EXTRACTION_ENABLED: "1"
    NOVAMEM_EXTRACTION_ENDPOINT: http://192.168.10.125:4000/v1
    NOVAMEM_EXTRACTION_MODEL: qwen3-6-35b-a3b
    NOVAMEM_HOST: 0.0.0.0
    NOVAMEM_INSECURE_COOKIES: "0"
    NOVAMEM_OBSERVER_ENABLED: "1"
    NOVAMEM_OBSERVER_ENDPOINT: http://192.168.10.125:4000/v1
    NOVAMEM_OBSERVER_MODEL: qwen3-6-35b-a3b
    NOVAMEM_PORT: "7778"
    NOVAMEM_QUERY_DECOMP_ENABLED: "1"
    NOVAMEM_QUERY_DECOMP_ENDPOINT: http://192.168.10.125:4000/v1
    NOVAMEM_QUERY_DECOMP_MODEL: qwen3-6-35b-a3b
    NOVAMEM_RERANK_ENABLED: "1"
    NOVAMEM_RERANK_ENDPOINT: http://192.168.10.125:4000/v1/rerank
    NOVAMEM_RERANK_MODEL: rerank
