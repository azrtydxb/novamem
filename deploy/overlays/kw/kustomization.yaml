apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: novamem
resources:
  - ../../k8s
  - availability.yaml
  - certificate.yaml
patches:
  # The namespace and credentials are bootstrapped outside application sync.
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: novamem
  - path: deployment.yaml
  - path: config.yaml
    target:
      kind: ConfigMap
      name: novamem-config
  - path: ingress.yaml
  - patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: postgres-data
        namespace: novamem
        annotations:
          sync.kuvryn.io/prune: disabled
      spec:
        storageClassName: longhorn
        resources:
          requests:
            storage: 20Gi
  - patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: qdrant-data
        namespace: novamem
        annotations:
          sync.kuvryn.io/prune: disabled
      spec:
        storageClassName: longhorn
