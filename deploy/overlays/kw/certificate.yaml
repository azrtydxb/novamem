apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: novamem-tls
  namespace: novamem
spec:
  secretName: novamem-tls
  dnsNames:
    - novamem.kw.watteel.lab
  issuerRef:
    name: cluster-ca
    kind: ClusterIssuer
    group: cert-manager.io
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
