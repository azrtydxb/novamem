        text/plain`."
  /mcp:
    post:
      summary: MCP Streamable HTTP transport (dual-era)
      tags:
        - mcp
      description:
        "Single-endpoint MCP transport serving both protocol eras (ADR 0006). Modern (2026-07-28):
        stateless — every POST declares its version in `params._meta` and mirrors `Mcp-Method` (plus `Mcp-Name`
        on `tools/call`) into headers, which are validated against the body; `server/discover` reports
        the supported versions. No session is minted or echoed. Legacy (2025-11-25 and earlier): `initialize`
        returns a session id in the `Mcp-Session-Id` response header which must be echoed on subsequent
        calls; GET opens a server→client SSE channel and DELETE closes the session. Origin and MCP-Protocol-Version
        are validated on every request; an unsupported version answers -32022 with the list to retry from."
      responses:
        "200":
          description: "MCP transport: a JSON-RPC envelope or an SSE stream, per the MCP spec"
      operationId: postMcp
    get:
      summary: MCP Streamable HTTP transport (dual-era)
      tags:
        - mcp
      description:
        "Single-endpoint MCP transport serving both protocol eras (ADR 0006). Modern (2026-07-28):
        stateless — every POST declares its version in `params._meta` and mirrors `Mcp-Method` (plus `Mcp-Name`
        on `tools/call`) into headers, which are validated against the body; `server/discover` reports
        the supported versions. No session is minted or echoed. Legacy (2025-11-25 and earlier): `initialize`
        returns a session id in the `Mcp-Session-Id` response header which must be echoed on subsequent
        calls; GET opens a server→client SSE channel and DELETE closes the session. Origin and MCP-Protocol-Version
        are validated on every request; an unsupported version answers -32022 with the list to retry from."
      responses:
        "200":
          description: "MCP transport: a JSON-RPC envelope or an SSE stream, per the MCP spec"
      operationId: getMcp
    delete:
      summary: MCP Streamable HTTP transport (dual-era)
      tags:
        - mcp
      description:
        "Single-endpoint MCP transport serving both protocol eras (ADR 0006). Modern (2026-07-28):
        stateless — every POST declares its version in `params._meta` and mirrors `Mcp-Method` (plus `Mcp-Name`
        on `tools/call`) into headers, which are validated against the body; `server/discover` reports
        the supported versions. No session is minted or echoed. Legacy (2025-11-25 and earlier): `initialize`
        returns a session id in the `Mcp-Session-Id` response header which must be echoed on subsequent
        calls; GET opens a server→client SSE channel and DELETE closes the session. Origin and MCP-Protocol-Version
        are validated on every request; an unsupported version answers -32022 with the list to retry from."
      responses:
        "200":
          description: "MCP transport: session teardown, no body"
      operationId: deleteMcp
  /live:
    get:
      summary: Liveness probe — process only, no dependency checks
      tags:
        - liveness
      responses:
        "200":
          description: Health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
      operationId: getLive
      description:
        Process liveness only — it checks nothing and answers 200 as long as the server is
        running. A restart probe pointed at `/ready` would restart the pod every time Postgres hiccupped;
        that is what this exists to avoid.
  /ready:
    get:
      summary: Readiness probe — dependency checks, boolean only
      tags:
        - readiness
      responses:
        "200":
          description: Health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
                additionalProperties: false
      operationId: getReady
      description:
        The same check as `/health`, under the name orchestrators expect. 200 when every dependency
        answers within 5s, 503 otherwise.
  /.well-known/oauth-protected-resource:
    get:
      summary: OAuth 2.0 Protected Resource Metadata (RFC 9728)
      tags:
        - auth
      description:
        'Discovery document the MCP authorization flow starts from: an unauthenticated request
        to a protected route answers 401 with `WWW-Authenticate: Bearer resource_metadata="…"` pointing
        here. Public — discovery has to work before the caller holds a credential.


        novamem is an OAuth 2.1 *resource* server in shape but not in issuance: it mints its own `nm_…`
        bearers from the dashboard rather than delegating to an authorization server, so `authorization_servers`
        is deliberately absent. Naming one that cannot issue tokens for this resource would send clients
        into a flow that dead-ends.'
      responses:
        "200":
          description: RFC 9728 document; its shape is the RFC's, not ours
          content:
            application/json:
              schema:
                type: object
                properties:
                  resource:
                    type: string
                  bearer_methods_supported:
                    type: array
                    items:
                      type: string
                  resource_name:
                    type: string
                  resource_documentation:
                    type: string
                required:
                  - resource
                additionalProperties: true
      operationId: getWellKnownOauthProtectedResource
  /health:
    get:
      summary: Readiness probe — dependency checks, boolean only
      tags:
        - readiness
      responses:
        "200":
          description: Health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
                additionalProperties: false
      operationId: getHealth
      description:
        'Readiness, not liveness: 200 `{"ok":true}` when the warm store and the cold store
        both answer, 503 `{"ok":false}` when either does not. The body is boolean only — no dependency
        detail leaks to an unauthenticated caller. Use it as a load-balancer health check; use `/live`
        for a restart probe.'
  /v1/admin/health/deep:
    get:
      summary: Admin-only dependency snapshot (warm/cold/graph status)
      tags:
        - admin
      security:
        - SessionCookie: []
      responses:
        "200":
          description: per-dependency snapshot; keys follow the dependencies present
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  deps:
                    type: object
                    properties:
                      warm:
                        type: string
                        enum:
                          - ok
                          - unreachable
                      cold:
                        type: string
                        enum:
                          - ok
                          - unreachable
                      graph:
                        type: string
                        enum:
                          - ok
                          - unreachable
                          - disabled
                      embedder:
                        type: string
                        enum:
                          - ok
                          - failing
                    required:
                      - warm
                      - cold
                      - graph
                      - embedder
                    additionalProperties: false
                  pendingEmbeddings:
                    nullable: true
                    type: number
                required:
                  - ok
                  - deps
                  - pendingEmbeddings
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
                additionalProperties: false
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  deps:
                    type: object
                    properties:
                      warm:
                        type: string
                        enum:
                          - ok
                          - unreachable
                      cold:
                        type: string
                        enum:
                          - ok
                          - unreachable
                      graph:
                        type: string
                        enum:
                          - ok
                          - unreachable
                          - disabled
                      embedder:
                        type: string
                        enum:
                          - ok
                          - failing
                    required:
                      - warm
                      - cold
                      - graph
                      - embedder
                    additionalProperties: false
                  pendingEmbeddings:
                    nullable: true
                    type: number
                required:
                  - ok
                  - deps
                  - pendingEmbeddings
                additionalProperties: false
      operationId: getV1AdminHealthDeep
      description:
        "Per-dependency status for operators: warm store, cold store and the graph tier reported
        separately. This is the detail `/health` deliberately withholds from anonymous callers, which
        is why it is admin-gated."
