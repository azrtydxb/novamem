      description:
        "Single-endpoint MCP transport serving both protocol eras (ADR 0006). Modern (2026-07-28):
        stateless — every POST declares its version in `params._meta` and mirrors `Mcp-Method` (plus `Mcp-Name`
        on `tools/call`) into headers, which are validated against the body; `server/discover` reports
        the supported versions. No session is minted or echoed. Legacy (2025-11-25 and earlier): `initialize`
        returns a session id in the `Mcp-Session-Id` response header which must be echoed on subsequent
        calls; GET opens a server→client SSE channel and DELETE closes the session. Origin and MCP-Protocol-Version
