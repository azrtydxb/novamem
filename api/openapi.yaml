        description:
          Rewrite an existing memory in place when a fact about the user has CHANGED. USE THIS
          — not forget+remember — when the user says "actually, I moved", "that's outdated", "correction",
          "I switched to X now", "I no longer use Y", "update what you have on Z". Preserves id, hit count,
          graph edges, and creation date — so the new content keeps every connection the original had.
          forget+remember would lose all of that. Omit `content` to update only metadata-side fields (sourceType,
          confidence, capturedFrom) without re-embedding. If you're not sure whether the old fact still
          applies somewhere else, search first to find related entries that may also need updating.
        inputSchema:
          type: object
          properties:
            id:
              type: string
              description: Memory id (ULID).
            content:
              type: string
            namespace:
              type: string
            metadata:
