            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
          in: query
          name: since
          required: false
        - schema:
            type: integer
            minimum: 0
            maximum: 9007199254740991
          in: query
          name: afterSeq
          required: false
        - schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            maximum: 500
          in: query
          name: limit
          required: false
      security:
        - SessionCookie: []
        - UserBearer: []
      responses:
        "200":
          description: ChangeFeed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeFeed"
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: getV1MeChanges
      description:
        Sequence-ordered feed of what changed for the caller — created, updated, superseded,
        deleted, expired — so a client can catch up after being offline. Pass the previous `nextSeq` to
        resume.
  /v1/me/today:
    get:
      summary: Lightweight cross-table activity feed for the user dashboard
      tags:
        - self-service
      security:
        - SessionCookie: []
        - UserBearer: []
      responses:
        "200":
          description: TodayFeed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodayFeed"
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-mcp-tool:
        name: memory_today
        description:
          Surface what the user has worked on today. CALL THIS AT THE START OF A NEW CONVERSATION
          when the user asks "what was I doing", "where did we leave off", "recap", "what's new today",
          "catch me up" — or proactively at session start to ground yourself in the user's current focus
          before answering anything substantive. Returns the last 24 h of entries newest-first. Cheaper
          than a full search when the user's question is about *recent* state. Combine with `memory_search`
          when the question spans further back than today.
        inputSchema:
          type: object
          properties:
            namespace:
              type: string
              description: Namespace shelf to write to / read from. Omit for the caller's default shelf.
            includeNamespaces:
              type: array
              items:
                type: string
              description: Union results across these shelves. Takes precedence over `namespace`.
            maxSensitivity:
              type: string
              enum:
                - public
                - internal
                - private
                - sensitive
              description: Maximum sensitivity to return; defaults to private, excluding sensitive.
            contentMode:
              type: string
              enum:
                - full
                - snippet
                - ids
              description:
                '"snippet" truncates content to ~240 chars (truncated: true on cut rows); "ids"
                omits content and metadata (rank first, hydrate later). Default "full".'
            k:
              type: number
              description: How many entries to return.
            project:
              type: string
              description: Project id or name.
            includeProjects:
              type: array
              items:
                type: string
              description: "Active-project mode: union user-global with each listed project (id or name)."
        annotations:
          title: Today's memory feed
          readOnlyHint: true
          idempotentHint: true
          openWorldHint: false
        x-order: 8
      operationId: getV1MeToday
  /v1/me/onboarding:
    get:
      summary: Derived onboarding state for the welcome wizard
      tags:
        - self-service
      security:
        - SessionCookie: []
        - UserBearer: []
      responses:
        "200":
          description: Onboarding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Onboarding"
        "401":
          description: Missing or invalid credentials
