openapi: 3.0.3
info:
  title: novamem
  version: 1.1.7
  description:
    "Tiered memory service with hybrid search (keyword + vector + graph), per-user isolation,
    and project-scoped sub-brains.


    **Auth**: every authenticated route accepts either an `nm_…` user bearer (created from the dashboard's
    API Tokens page) or a Better Auth session cookie/bearer (set by `POST /api/auth/sign-in/email`). Both
    flow through the same auth hook and resolve to the same user. Better Auth's own routes are mounted
    at `/api/auth/*` — see the Better Auth documentation for their shapes."
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: /
    description: this server
tags:
  - name: memory
    description: Read/write the memory data plane
  - name: lifecycle
    description: Decay, dream cycle, orphan reaper, stats
  - name: auth
    description: Rotate `nm_…` bearers (Better Auth's own surface lives at /api/auth/*)
  - name: self-service
    description: Per-caller settings (active project)
  - name: projects
    description: Project CRUD + membership
  - name: tokens
    description: Per-device `nm_…` bearer management
  - name: metrics
    description: Per-user metrics + 24h history
  - name: admin
    description: Admin-only endpoints (role=admin)
  - name: mcp
    description: Model Context Protocol transport (Streamable HTTP, dual-era)
  - name: liveness
    description: Health checks
components:
  securitySchemes:
    UserBearer:
      type: http
      scheme: bearer
      bearerFormat: nm_…
      description:
        Per-device API token belonging to one user. Carries every right the owning user has
        — data plane, project CRUD, membership, metrics. Created from the dashboard's API Tokens page;
        the plaintext is shown once.
    SessionCookie:
      type: apiKey
      in: cookie
      name: nm.session_token
      description:
        Better Auth session cookie set by /api/auth/sign-in/email. HttpOnly + SameSite=Lax.
        Browsers attach it automatically.
  schemas:
    Error:
      type: object
      properties:
        error: &id001
          type: string
      required:
        - error
    MemoryEntry:
      type: object
      properties:
        id: *id001
        content: *id001
        namespace: *id001
        project:
          type: string
          nullable: true
        tier:
          type: string
          enum:
            - warm
            - cold
        source: *id001
        score: &id003
          type: number
        metadata:
          type: object
          additionalProperties: true
      required:
        - id
        - content
    RememberResult:
      type: object
      properties:
        id:
          type: string
          nullable: true
        rejected: *id001
        deduplicated: &id002
          type: boolean
        embedded: *id002
      required:
        - id
    CaptureResult:
      type: object
      properties:
        id:
          type: string
          nullable: true
        rejected: *id001
        deduplicated: *id002
        updated: *id002
        superseded:
          type: array
          items: *id001
        embedded: *id002
      required:
        - id
    EntryList:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/MemoryEntry"
      required:
        - results
    UpdateResult:
      type: object
      properties:
        id: *id001
        updated: *id002
        embeddingChanged: *id002
      required:
        - id
        - updated
        - embeddingChanged
    ForgetResult:
      type: object
      properties:
        deleted: *id002
        coldDeleteOk: *id002
      required:
        - deleted
    Stats:
      type: object
      properties:
        byNamespace:
          type: object
          additionalProperties:
            type: object
            properties:
              warm: *id003
              cold: *id003
        totalWarm: *id003
        totalCold: *id003
        lastDecayAt:
          type: string
          nullable: true
        uptimeMs: *id003
      required:
        - byNamespace
        - totalWarm
        - totalCold
    SessionRecapResult:
      type: object
      properties:
        saved: *id003
        results:
          type: array
          items:
            $ref: "#/components/schemas/CaptureResult"
      required:
        - saved
        - results
    HygieneReport:
      type: object
      properties:
        summary:
          type: object
          properties:
            scanned: *id003
            lowValue: *id003
            stale: *id003
            duplicateClusters: *id003
            contradictionCandidates: *id003
            orphanCandidates: *id003
        lowValue:
          type: array
          items: {}
        stale:
          type: array
          items: {}
        duplicateClusters:
          type: array
          items: {}
        contradictionCandidates:
          type: array
          items: {}
        orphanCandidates:
          type: array
          items: {}
      required:
        - summary
    EvaluateReport:
      type: object
      properties:
        suite: *id001
        passed: *id002
        summary:
          type: object
          properties:
            total: *id003
            passed: *id003
            failed: *id003
        cases:
          type: array
          items:
            type: object
            properties:
              name: *id001
              passed: *id002
      required:
        - suite
        - passed
        - summary
        - cases
    DecayResult:
      type: object
      properties:
        demoted: *id003
        promoted: *id003
        expired: *id003
      required:
        - demoted
        - promoted
        - expired
    DreamCycleResult:
      type: object
      properties:
        walked: *id003
        merged: *id003
        edgesPromoted: *id003
        factsWalked: *id003
        factClustersJudged: *id003
        factsSuperseded: *id003
        durationMs: *id003
    ReapOrphansResult:
      type: object
      properties:
        attempted: *id003
        cleared: *id003
        abandoned: *id003
        pending: *id003
        total: *id003
    ObserveResult:
      type: object
      properties:
        observed: *id003
        reflected: *id002
        logChars: *id003
    Project:
      type: object
      properties:
        id: *id001
        name: *id001
        ownerUserId: *id001
        createdAt: *id001
      required:
        - id
        - name
    ProjectList:
      type: object
      properties:
        projects:
          type: array
          items:
            $ref: "#/components/schemas/ProjectListItem"
      required:
        - projects
    ActiveProject:
      type: object
      properties:
        active:
          type: object
          properties:
            id: *id001
            name: *id001
          nullable: true
      required:
        - active
    MemberList:
      type: object
      properties:
        members:
          type: array
          items:
            type: object
            properties:
              userId: *id001
              username: *id001
              role: *id001
              joinedAt: *id001
      required:
        - members
    TodayFeed:
      type: object
      properties:
        events:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
                enum:
                  - remember
                  - token
                  - project
                  - audit
              at: *id001
              text: *id001
              project:
                type: string
                nullable: true
      required:
        - events
    Onboarding:
      type: object
      properties:
        bootstrapDone: *id002
        userExists: *id002
        mintedToken: *id002
        remembered: *id002
        userId:
          type: string
          nullable: true
    MetricsHistory:
      type: object
      properties:
        hours: *id003
        samples:
          type: array
          items:
            type: object
            properties:
              sampledAt: *id001
              queries: *id003
              remembers: *id003
    TokenList:
      type: object
      properties:
        tokens:
          type: array
          items:
            type: object
            additionalProperties: true
      required:
        - tokens
    MintedToken:
      type: object
      properties:
        token: *id001
        userId: *id001
        createdAt: *id001
        scope: *id001
        projectId:
          type: string
          nullable: true
        expiresAt:
          type: string
          nullable: true
        warning: *id001
      required:
        - token
    Usage:
      type: object
      properties:
        entries: *id003
        quota:
          type: object
          properties:
            maxEntries:
              type: number
              nullable: true
            writesPerMinute:
              type: number
              nullable: true
    ChangeFeed:
      type: object
      properties:
        changes:
          type: array
          items:
            type: object
            properties:
              seq: *id003
              entryId: *id001
              projectId:
                type: string
                nullable: true
              change:
                type: string
                enum:
                  - created
                  - updated
                  - superseded
                  - deleted
                  - expired
              detail:
                type: object
                additionalProperties: true
                nullable: true
              at: *id001
        nextSeq:
          type: number
          nullable: true
      required:
        - changes
    Health:
      type: object
      properties:
        ok: *id002
      required:
        - ok
      additionalProperties: false
    ProjectDeleted:
      type: object
      properties:
        deleted: &id004
          type: boolean
        entriesRemoved:
          type: number
        coldCollectionsDropped:
          type: array
          items: &id006
            type: string
          nullable: true
          description: Per-scope report from the cold vector store; null when it dropped nothing.
        graphCleared: *id004
      required:
        - deleted
    AdoptionReport:
      type: object
      properties:
        requestedClient: &id005
          type: string
        server:
          type: object
          additionalProperties: true
        mcp:
          type: object
          additionalProperties: true
        features:
          type: object
          additionalProperties: true
        requiredTools:
          type: array
          items: *id005
        diagnostics:
          type: array
          items:
            type: object
            additionalProperties: true
        refresh:
          type: object
          additionalProperties: true
      required:
        - requestedClient
        - server
        - mcp
        - diagnostics
    SearchResult:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/MemoryEntry"
        degraded:
          type: boolean
          description: True when a tier (cold store or graph) was unreachable, so these hits may be partial.
      required:
        - results
    ProjectListItem:
      type: object
      properties:
        id: *id001
        name: *id001
        ownerUserId: *id001
        createdAt: *id001
        role:
          type: string
          description: "The caller's role on this project: owner or member."
      required:
        - id
        - name
        - role
    MemberAdded:
      type: object
      properties:
        added: &id007
          type: boolean
        userId: *id006
        username: *id006
      required:
        - added
        - userId
        - username
    MemberRemoved:
      type: object
      properties:
        removed: *id007
      required:
        - removed
paths:
  /v1/auth/rotate-token:
    post:
      summary: Self-rotate the caller's `nm_…` bearer (user mode only)
      tags:
        - auth
      security:
        - UserBearer: []
      responses:
        "200":
          description: MintedToken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MintedToken"
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: postV1AuthRotateToken
      description:
        Mint a replacement bearer for the caller and invalidate the one used to make this call,
        in a single step. The old token stops working the moment this returns, so read the new one from
        the response before discarding it.
  /v1/adoption:
    post:
      summary: Client adoption and refresh diagnostics for MCP/tooling integrations
      tags:
        - memory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client:
                  type: string
                  maxLength: 64
                observedTools:
                  maxItems: 128
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 128
                observedInstructionsHash:
                  type: string
                  pattern: ^[a-fA-F0-9]{64}$
              additionalProperties: false
      security:
        - UserBearer: []
        - SessionCookie: []
      responses:
        "200":
          description: AdoptionReport
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdoptionReport"
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-mcp-tool:
        name: memory_adoption
        description:
          Read-only client adoption report. Use this to verify the current MCP tool surface,
          instructions hash, supported feature flags, and exact refresh/reload guidance when an agent
          client may be using stale tools or stale instructions.
        inputSchema:
          type: object
          properties:
            client:
              type: string
              description: Client name, e.g. hermes, claude-code, claude-desktop, codex, cursor.
            observedTools:
              type: array
              items:
                type: string
              description: Optional tools/list names observed by the caller for stale-surface diagnostics.
            observedInstructionsHash:
              type: string
              description: Optional sha256 hash of the instructions observed by the caller.
        annotations:
          title: Client adoption report
          readOnlyHint: true
          idempotentHint: true
          openWorldHint: false
        x-order: 5
      operationId: postV1Adoption
  /v1/hygiene:
    post:
      summary: Read-only memory hygiene report
      tags:
        - memory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                k:
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                  maximum: 100
              additionalProperties: false
      security:
        - UserBearer: []
        - SessionCookie: []
      responses:
        "200":
          description: HygieneReport
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HygieneReport"
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-mcp-tool:
        name: memory_hygiene
        description:
          "Read-only hygiene report for memory curation: low-value entries, stale current-state
          candidates, duplicate clusters, contradiction candidates, and warm/cold orphan candidates."
        inputSchema:
          type: object
          properties:
            k:
              type: number
              description: Max candidates per section.
        annotations:
          title: Memory hygiene report
          readOnlyHint: true
          idempotentHint: true
          openWorldHint: false
        x-order: 3
      operationId: postV1Hygiene
  /v1/evaluate:
    post:
      summary: Run built-in memory quality evaluation scenarios
      tags:
        - memory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                suite:
                  type: string
                  minLength: 1
                  maxLength: 64
              additionalProperties: false
      security:
        - UserBearer: []
        - SessionCookie: []
      responses:
        "200":
          description: EvaluateReport
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluateReport"
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-mcp-tool:
        name: memory_evaluate
        description:
          Run built-in memory quality checks covering supersession, context packs, junk rejection,
          hygiene availability, and retention policy wiring.
        inputSchema:
          type: object
          properties:
            suite:
              type: string
              description: Evaluation suite name; default core.
        annotations:
          title: Evaluate memory quality
          readOnlyHint: true
          idempotentHint: true
          openWorldHint: false
        x-order: 4
      operationId: postV1Evaluate
  /v1/search:
    post:
      summary: Hybrid search (keyword + vector + graph) over the caller's memories
      tags:
        - memory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                  minLength: 1
                  maxLength: 8192
                k:
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                  maximum: 200
                namespace:
                  type: string
                  maxLength: 128
                agentName:
                  nullable: true
                  type: string
                  maxLength: 128
                project:
                  nullable: true
                  type: string
                  minLength: 1
                  maxLength: 128
                includeProjects:
                  maxItems: 16
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 128
                includeNamespaces:
                  maxItems: 16
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 128
                    pattern: ^[a-z0-9][a-z0-9._:-]*$
                weights:
                  type: object
                  properties:
                    keyword:
                      type: number
                    vector:
                      type: number
                    graph:
                      type: number
                    recency:
                      type: number
                    entity:
                      type: number
                contentMode:
                  type: string
                  enum:
                    - full
                    - snippet
                    - ids
                maxSensitivity:
                  type: string
                  enum:
                    - public
                    - internal
                    - private
                    - sensitive
                asOf:
                  nullable: true
                  type: string
                  format: date-time
                  pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                decompose:
                  type: boolean
                expandSourceChunks:
                  type: boolean
                rerank:
                  type: boolean
                minVectorScore:
                  type: number
                  minimum: 0
                  maximum: 1
                maxTokens:
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                  maximum: 1000000
              required:
                - query
      security:
        - UserBearer: []
        - SessionCookie: []
      responses:
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: SearchResult
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"
      x-mcp-tool:
        name: memory_search
        description:
          'Search the user''s persistent memory store for facts about them. CALL THIS PROACTIVELY
          at the start of any conversation where personal context might matter — preferences, project
          context, biographical details, prior decisions. Do not wait for the user to remind you they''ve
          stored something. If the user references "my project", "what I told you", "as we discussed",
          "the same as before", or any personal context that isn''t already in this conversation, search
          here FIRST before asking them to repeat. This store contains facts the user has explicitly chosen
          to persist, so its contents are higher-confidence than inferences from your built-in conversation
          memory or `memory_user_edits`. Hybrid keyword (FTS) + vector (cosine) + graph (neighbours) fused
          via weighted scoring (defaults keyword 0.3, vector 0.6, graph 0.1). Override `weights` only
          with a specific reason — e.g. `{ keyword: 1, vector: 0 }` for exact-id / symbol lookup, or `{
          vector: 1, keyword: 0 }` to ignore literal overlap and lean fully on semantic similarity.'
        inputSchema:
          type: object
          properties:
            query:
              type: string
              description:
                What to search for, in natural language. Hybrid retrieval fuses keyword, vector,
                graph, recency and entity signals over it.
            k:
              type: number
              description: Top-K to return (default 10)
            namespace:
              type: string
              description:
                Single namespace shelf to search. Overridden by `includeNamespaces` when both
                are set. Omit both to fan out across every namespace with entries visible in the current
                scope (user-global and/or active projects).
            includeNamespaces:
              type: array
              items:
                type: string
              description:
                "Cross-namespace search: union results across these shelves. Takes precedence
                over `namespace`. Use to *restrict* the default fanout to a specific subset; if you want
                everything, omit both fields."
            project:
              type: string
              description: Project to scope to. Accepts id (ULID) or human name. Omit for user-wide entries.
            includeProjects:
              type: array
              items:
                type: string
              description: "Active-project mode: union user-global with each listed project (id or name)."
            weights:
              type: object
              description: Per-signal weight overrides. Omit to use defaults.
              properties:
                keyword:
                  type: number
                  description: FTS keyword match weight
                vector:
                  type: number
                  description: Embedding cosine weight
                graph:
                  type: number
                  description: Graph-neighbour weight
            contentMode:
              type: string
              enum:
                - full
                - snippet
                - ids
              description:
                '"snippet" truncates content to ~240 chars (truncated: true on cut rows); "ids"
                omits content and metadata (rank first, hydrate later). Default "full".'
          required:
            - query
        annotations:
          title: Search memory
          readOnlyHint: true
          idempotentHint: true
          openWorldHint: false
        x-order: 6
      operationId: postV1Search
  /v1/context:
    post:
      summary: Get first-pass memory context for a user message
      tags:
        - memory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  minLength: 1
                  maxLength: 8192
                k:
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                  maximum: 50
                namespace:
                  type: string
                  maxLength: 128
                project:
                  nullable: true
                  type: string
                  minLength: 1
                  maxLength: 128
                includeProjects:
                  maxItems: 16
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 128
                includeNamespaces:
                  maxItems: 16
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 128
                    pattern: ^[a-z0-9][a-z0-9._:-]*$
                weights:
                  type: object
                  properties:
                    keyword:
                      type: number
                    vector:
                      type: number
                    graph:
                      type: number
                    recency:
                      type: number
                    entity:
                      type: number
                maxSensitivity:
                  type: string
                  enum:
                    - public
                    - internal
                    - private
                    - sensitive
                asOf:
                  nullable: true
                  type: string
                  format: date-time
                  pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                decompose:
                  type: boolean
                expandSourceChunks:
                  type: boolean
                maxTokens:
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                  maximum: 1000000
              required:
                - message
      security:
        - UserBearer: []
        - SessionCookie: []
      responses:
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: SearchResult
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"
      x-mcp-tool:
        name: memory_context
        description:
          Mandatory first-pass grounding tool. CALL THIS before answering any substantive user
          request. Returns relevant hybrid search results plus recent memory in one response so agents
          stop ignoring memory unless explicitly told.
        inputSchema:
          type: object
          properties:
            message:
              type: string
              description: The user's current message or task.
            k:
              type: number
              description: Top-K relevant/recent entries to return.
            namespace:
              type: string
              description: Namespace shelf to write to / read from. Omit for the caller's default shelf.
            includeNamespaces:
              type: array
              items:
                type: string
              description: Union results across these shelves. Takes precedence over `namespace`.
            maxSensitivity:
              type: string
              enum:
                - public
                - internal
                - private
                - sensitive
              description: Maximum sensitivity to return; defaults to private, excluding sensitive.
            project:
              type: string
              description: Project id or human name.
            includeProjects:
              type: array
              items:
                type: string
              description: "Active-project mode: union user-global with each listed project (id or name)."
            weights:
              type: object
              properties:
                keyword:
                  type: number
                vector:
                  type: number
                graph:
                  type: number
