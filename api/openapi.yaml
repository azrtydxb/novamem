openapi: 3.0.3
info:
  title: novamem
  version: 1.1.7
  description:
    "Tiered memory service with hybrid search (keyword + vector + graph), per-user isolation,
    and project-scoped sub-brains.


    **Auth**: every authenticated route accepts either an `nm_…` user bearer (created from the dashboard's
    API Tokens page) or a Better Auth session cookie/bearer (set by `POST /api/auth/sign-in/email`). Both
    flow through the same auth hook and resolve to the same user. Better Auth's own routes are mounted
    at `/api/auth/*` — see the Better Auth documentation for their shapes."
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: /
    description: this server
tags:
  - name: memory
    description: Read/write the memory data plane
  - name: lifecycle
    description: Decay, dream cycle, orphan reaper, stats
  - name: auth
    description: Rotate `nm_…` bearers (Better Auth's own surface lives at /api/auth/*)
  - name: self-service
    description: Per-caller settings (active project)
  - name: projects
    description: Project CRUD + membership
  - name: tokens
    description: Per-device `nm_…` bearer management
  - name: metrics
    description: Per-user metrics + 24h history
  - name: admin
    description: Admin-only endpoints (role=admin)
  - name: mcp
    description: Model Context Protocol transport (Streamable HTTP, dual-era)
  - name: liveness
    description: Health checks
components:
  securitySchemes:
    UserBearer:
      type: http
      scheme: bearer
      bearerFormat: nm_…
      description:
        Per-device API token belonging to one user. Carries every right the owning user has
        — data plane, project CRUD, membership, metrics. Created from the dashboard's API Tokens page;
        the plaintext is shown once.
    SessionCookie:
      type: apiKey
      in: cookie
      name: nm.session_token
      description:
        Better Auth session cookie set by /api/auth/sign-in/email. HttpOnly + SameSite=Lax.
        Browsers attach it automatically.
  schemas: {}
paths:
  /v1/auth/rotate-token:
    post:
      summary: Self-rotate the caller's `nm_…` bearer (user mode only)
      tags:
        - auth
      security:
        - UserBearer: []
      responses:
        "200":
          description: Default Response
      operationId: postV1AuthRotateToken
  /v1/adoption:
    post:
      summary: Client adoption and refresh diagnostics for MCP/tooling integrations
      tags:
        - memory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client:
                  type: string
                  maxLength: 64
                observedTools:
                  maxItems: 128
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 128
                observedInstructionsHash:
                  type: string
                  pattern: ^[a-fA-F0-9]{64}$
              additionalProperties: false
      security:
        - UserBearer: []
        - SessionCookie: []
      responses:
        "200":
          description: Default Response
      x-mcp-tool:
        name: memory_adoption
        description:
          Read-only client adoption report. Use this to verify the current MCP tool surface,
          instructions hash, supported feature flags, and exact refresh/reload guidance when an agent
          client may be using stale tools or stale instructions.
        inputSchema:
          type: object
          properties:
            client:
              type: string
              description: Client name, e.g. hermes, claude-code, claude-desktop, codex, cursor.
            observedTools:
              type: array
              items:
                type: string
              description: Optional tools/list names observed by the caller for stale-surface diagnostics.
            observedInstructionsHash:
              type: string
              description: Optional sha256 hash of the instructions observed by the caller.
        annotations:
          title: Client adoption report
          readOnlyHint: true
          idempotentHint: true
          openWorldHint: false
        x-order: 5
      operationId: postV1Adoption
  /v1/hygiene:
    post:
      summary: Read-only memory hygiene report
      tags:
        - memory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                k:
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                  maximum: 100
              additionalProperties: false
      security:
        - UserBearer: []
        - SessionCookie: []
      responses:
        "200":
          description: Default Response
      x-mcp-tool:
        name: memory_hygiene
        description:
          "Read-only hygiene report for memory curation: low-value entries, stale current-state
          candidates, duplicate clusters, contradiction candidates, and warm/cold orphan candidates."
        inputSchema:
          type: object
          properties:
            k:
              type: number
              description: Max candidates per section.
        annotations:
          title: Memory hygiene report
          readOnlyHint: true
          idempotentHint: true
          openWorldHint: false
        x-order: 3
      operationId: postV1Hygiene
  /v1/evaluate:
    post:
      summary: Run built-in memory quality evaluation scenarios
      tags:
        - memory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                suite:
                  type: string
                  minLength: 1
                  maxLength: 64
              additionalProperties: false
      security:
        - UserBearer: []
        - SessionCookie: []
      responses:
        "200":
          description: Default Response
      x-mcp-tool:
        name: memory_evaluate
        description:
          Run built-in memory quality checks covering supersession, context packs, junk rejection,
          hygiene availability, and retention policy wiring.
        inputSchema:
          type: object
          properties:
            suite:
              type: string
              description: Evaluation suite name; default core.
        annotations:
          title: Evaluate memory quality
          readOnlyHint: true
          idempotentHint: true
          openWorldHint: false
        x-order: 4
      operationId: postV1Evaluate
  /v1/search:
    post:
      summary: Hybrid search (keyword + vector + graph) over the caller's memories
      tags:
        - memory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                  minLength: 1
                  maxLength: 8192
                k:
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                  maximum: 200
                namespace:
                  type: string
                  maxLength: 128
                agentName:
                  nullable: true
                  type: string
                  maxLength: 128
                project:
                  nullable: true
                  type: string
                  minLength: 1
                  maxLength: 128
                includeProjects:
                  maxItems: 16
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 128
                includeNamespaces:
                  maxItems: 16
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 128
                    pattern: ^[a-z0-9][a-z0-9._:-]*$
                weights:
                  type: object
                  properties:
                    keyword:
                      type: number
                    vector:
                      type: number
                    graph:
                      type: number
                    recency:
                      type: number
                    entity:
                      type: number
                contentMode:
                  type: string
                  enum:
                    - full
                    - snippet
                    - ids
                maxSensitivity:
                  type: string
                  enum:
                    - public
                    - internal
                    - private
                    - sensitive
                asOf:
                  nullable: true
                  type: string
                  format: date-time
                  pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                decompose:
                  type: boolean
                expandSourceChunks:
                  type: boolean
                rerank:
                  type: boolean
                minVectorScore:
                  type: number
                  minimum: 0
                  maximum: 1
                maxTokens:
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                  maximum: 1000000
              required:
                - query
      security:
        - UserBearer: []
        - SessionCookie: []
      responses:
        "200":
          description: Default Response
      x-mcp-tool:
        name: memory_search
        description:
          'Search the user''s persistent memory store for facts about them. CALL THIS PROACTIVELY
          at the start of any conversation where personal context might matter — preferences, project
          context, biographical details, prior decisions. Do not wait for the user to remind you they''ve
          stored something. If the user references "my project", "what I told you", "as we discussed",
          "the same as before", or any personal context that isn''t already in this conversation, search
          here FIRST before asking them to repeat. This store contains facts the user has explicitly chosen
          to persist, so its contents are higher-confidence than inferences from your built-in conversation
          memory or `memory_user_edits`. Hybrid keyword (FTS) + vector (cosine) + graph (neighbours) fused
          via weighted scoring (defaults keyword 0.3, vector 0.6, graph 0.1). Override `weights` only
          with a specific reason — e.g. `{ keyword: 1, vector: 0 }` for exact-id / symbol lookup, or `{
          vector: 1, keyword: 0 }` to ignore literal overlap and lean fully on semantic similarity.'
        inputSchema:
          type: object
          properties:
            query:
              type: string
            k:
              type: number
              description: Top-K to return (default 10)
            namespace:
              type: string
              description:
                Single namespace shelf to search. Overridden by `includeNamespaces` when both
                are set. Omit both to fan out across every namespace with entries visible in the current
                scope (user-global and/or active projects).
            includeNamespaces:
              type: array
              items:
                type: string
              description:
                "Cross-namespace search: union results across these shelves. Takes precedence
                over `namespace`. Use to *restrict* the default fanout to a specific subset; if you want
                everything, omit both fields."
            project:
              type: string
              description: Project to scope to. Accepts id (ULID) or human name. Omit for user-wide entries.
            includeProjects:
              type: array
              items:
                type: string
              description: "Active-project mode: union user-global with each listed project (id or name)."
            weights:
              type: object
              description: Per-signal weight overrides. Omit to use defaults.
              properties:
                keyword:
                  type: number
                  description: FTS keyword match weight
                vector:
                  type: number
                  description: Embedding cosine weight
                graph:
                  type: number
                  description: Graph-neighbour weight
            contentMode:
              type: string
              enum:
                - full
                - snippet
                - ids
              description:
                '"snippet" truncates content to ~240 chars (truncated: true on cut rows); "ids"
                omits content and metadata (rank first, hydrate later). Default "full".'
          required:
            - query
        annotations:
          title: Search memory
          readOnlyHint: true
          idempotentHint: true
          openWorldHint: false
        x-order: 6
      operationId: postV1Search
  /v1/context:
    post:
      summary: Get first-pass memory context for a user message
      tags:
        - memory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  minLength: 1
                  maxLength: 8192
                k:
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                  maximum: 50
                namespace:
                  type: string
                  maxLength: 128
                project:
                  nullable: true
                  type: string
                  minLength: 1
                  maxLength: 128
                includeProjects:
                  maxItems: 16
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 128
                includeNamespaces:
                  maxItems: 16
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 128
                    pattern: ^[a-z0-9][a-z0-9._:-]*$
                weights:
                  type: object
                  properties:
                    keyword:
                      type: number
                    vector:
                      type: number
                    graph:
                      type: number
                    recency:
                      type: number
                    entity:
                      type: number
                maxSensitivity:
                  type: string
                  enum:
                    - public
                    - internal
                    - private
                    - sensitive
                asOf:
                  nullable: true
                  type: string
                  format: date-time
                  pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                decompose:
                  type: boolean
                expandSourceChunks:
                  type: boolean
                maxTokens:
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                  maximum: 1000000
              required:
                - message
      security:
        - UserBearer: []
        - SessionCookie: []
      responses:
        "200":
          description: Default Response
      x-mcp-tool:
        name: memory_context
        description:
          Mandatory first-pass grounding tool. CALL THIS before answering any substantive user
          request. Returns relevant hybrid search results plus recent memory in one response so agents
          stop ignoring memory unless explicitly told.
        inputSchema:
          type: object
          properties:
            message:
              type: string
              description: The user's current message or task.
            k:
              type: number
              description: Top-K relevant/recent entries to return.
            namespace:
              type: string
            includeNamespaces:
              type: array
              items:
                type: string
            maxSensitivity:
              type: string
              enum:
                - public
                - internal
                - private
                - sensitive
              description: Maximum sensitivity to return; defaults to private, excluding sensitive.
            project:
              type: string
              description: Project id or human name.
            includeProjects:
              type: array
              items:
                type: string
            weights:
              type: object
              properties:
                keyword:
                  type: number
                vector:
                  type: number
                graph:
                  type: number
          required:
            - message
        annotations:
          title: Get memory context
          readOnlyHint: true
          idempotentHint: true
          openWorldHint: false
        x-order: 0
      operationId: postV1Context
  /v1/capture:
    post:
      summary: Capture a durable memory fact with provenance defaults
      tags:
        - memory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 262144
                namespace:
                  type: string
                  maxLength: 128
                source:
                  type: string
                  maxLength: 128
                agentName:
                  nullable: true
                  type: string
                  maxLength: 128
                project:
                  nullable: true
                  type: string
                  minLength: 1
                  maxLength: 128
                metadata:
                  type: object
                  additionalProperties: {}
                sensitivity:
                  type: string
                  enum:
                    - public
                    - internal
                    - private
                    - sensitive
                sourceType:
                  type: string
                  maxLength: 64
                capturedFrom:
                  type: string
                  maxLength: 256
                confidence:
                  type: number
                  minimum: 0
                  maximum: 1
                force:
                  type: boolean
                expiresAt:
                  type: string
                  format: date-time
                  pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
              required:
                - content
      security:
        - UserBearer: []
        - SessionCookie: []
      responses:
        "200":
          description: Default Response
      x-mcp-tool:
        name: memory_capture
        description:
          Low-friction durable write path. CALL THIS after meaningful work to save durable
          outcomes, decisions, changed preferences, verified setup facts, and root-cause lessons. Do not
          save secrets or transient task chatter.
        inputSchema:
          type: object
          properties:
            content:
              type: string
            namespace:
              type: string
            source:
              type: string
            sourceType:
              type: string
            capturedFrom:
              type: string
            confidence:
              type: number
              description: 0..1, default 1.0
            force:
              type: boolean
            project:
              type: string
              description: Optional project (sub-brain) to scope to.
            metadata:
              type: object
            sensitivity:
              type: string
              enum:
                - public
                - internal
                - private
                - sensitive
            expiresAt:
              type: string
              description:
                Explicit TTL — ISO-8601 WITH timezone offset (e.g. 2026-08-14T12:00:00Z); offset-less
                strings are rejected. Past it the entry is hidden from reads and later hard-deleted.
          required:
            - content
        annotations:
          title: Capture durable memory
          readOnlyHint: false
          destructiveHint: false
          idempotentHint: true
          openWorldHint: false
        x-order: 1
      operationId: postV1Capture
  /v1/session-recap:
    post:
      summary: Ingest a concise session recap as typed durable memories
      tags:
        - memory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decisions:
                  type: array
                  items:
                    type: string
                    minLength: 12
                    maxLength: 4000
                setupFacts:
                  type: array
                  items:
                    type: string
                    minLength: 12
                    maxLength: 4000
                rootCauses:
                  type: array
                  items:
                    type: string
                    minLength: 12
                    maxLength: 4000
                preferences:
                  type: array
                  items:
                    type: string
                    minLength: 12
                    maxLength: 4000
                projectConventions:
                  type: array
                  items:
                    type: string
                    minLength: 12
                    maxLength: 4000
                safetyConstraints:
                  type: array
                  items:
                    type: string
                    minLength: 12
                    maxLength: 4000
                other:
                  type: array
                  items:
                    type: string
                    minLength: 12
                    maxLength: 4000
                namespace:
                  type: string
                  minLength: 1
                  maxLength: 128
                source:
                  type: string
                  minLength: 1
                  maxLength: 256
                sourceType:
                  type: string
                  minLength: 1
                  maxLength: 64
                capturedFrom:
                  type: string
                  minLength: 1
                  maxLength: 256
                agentName:
                  nullable: true
                  type: string
                  maxLength: 128
                confidence:
                  type: number
                  minimum: 0
                  maximum: 1
                force:
                  type: boolean
                project:
                  nullable: true
                  type: string
                  minLength: 1
                  maxLength: 128
                metadata:
                  type: object
                  additionalProperties: {}
                sensitivity:
                  type: string
                  enum:
                    - public
                    - internal
                    - private
                    - sensitive
              additionalProperties: false
      security:
        - UserBearer: []
        - SessionCookie: []
      responses:
        "200":
          description: Default Response
      x-mcp-tool:
        name: memory_session_recap
        description:
          Ingest a concise end-of-session recap as durable typed memories. Use this after meaningful
          sessions to save decisions, setup facts, root causes, preferences, project conventions, and
          safety constraints without dumping transcripts.
        inputSchema:
          type: object
          properties:
            decisions:
              type: array
              items:
                type: string
            setupFacts:
              type: array
              items:
                type: string
            rootCauses:
              type: array
              items:
                type: string
            preferences:
              type: array
              items:
                type: string
            projectConventions:
              type: array
              items:
                type: string
            safetyConstraints:
              type: array
              items:
                type: string
            other:
              type: array
              items:
                type: string
            namespace:
              type: string
            source:
              type: string
            sourceType:
              type: string
            capturedFrom:
              type: string
            confidence:
              type: number
              description: 0..1, default 1.0
            force:
              type: boolean
            project:
              type: string
              description: Optional project (sub-brain) to scope to.
            metadata:
              type: object
            sensitivity:
              type: string
              enum:
                - public
                - internal
                - private
                - sensitive
        annotations:
          title: Ingest session recap
          readOnlyHint: false
          destructiveHint: false
          idempotentHint: true
          openWorldHint: false
        x-order: 2
      operationId: postV1SessionRecap
  /v1/remember:
    post:
      summary: Store a new memory entry
      tags:
        - memory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 262144
                namespace:
                  type: string
                  maxLength: 128
                source:
                  type: string
                  maxLength: 128
                agentName:
                  nullable: true
                  type: string
                  maxLength: 128
                project:
                  nullable: true
                  type: string
                  minLength: 1
                  maxLength: 128
                metadata:
                  type: object
                  additionalProperties: {}
                sensitivity:
                  type: string
                  enum:
                    - public
                    - internal
                    - private
                    - sensitive
                sourceType:
                  type: string
                  maxLength: 64
                capturedFrom:
                  type: string
                  maxLength: 256
                confidence:
                  type: number
                  minimum: 0
                  maximum: 1
                force:
                  type: boolean
                expiresAt:
                  type: string
                  format: date-time
                  pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
              required:
                - content
      security:
        - UserBearer: []
        - SessionCookie: []
      responses:
        "200":
          description: Default Response
      x-mcp-tool:
        name: memory_remember
        description:
          'Store a personal fact about the user in their persistent memory store. USE THIS
          FOR ALL personal facts the user asks you to remember: preferences (favourite tools, foods, response
          style), biographical info (location, role, family), project context (what they''re building,
          what stack they use), recurring tasks, communication preferences, and anything the user says
          with phrases like "remember", "don''t forget", "save this", "please remember that", "for future
          reference", "keep this in mind", or "note that". This is the user''s primary memory system and
          TAKES PRECEDENCE OVER `memory_user_edits` for any user-specific content. Use `memory_user_edits`
          only for routing rules about your own behaviour (e.g. "always respond in French") — not for
          facts about the user. When in doubt between the two, use this tool. Pass `project` to scope
          the fact to a sub-brain; omit for user-wide facts that should apply across all contexts. The
          worthiness gate rejects content under 12 chars or filler ("ok", "thanks"); pass `force: true`
          only when the short content is a deliberate anchor (id, version pin, phone number).'
        inputSchema:
          type: object
          properties:
            content:
              type: string
            namespace:
              type: string
            source:
              type: string
            sourceType:
              type: string
              description: chat | email | code-review | doc | inference | observation | system | manual
            capturedFrom:
              type: string
              description: Agent name, conversation id, or other channel ref.
            confidence:
              type: number
              description: 0..1, default 1.0
            force:
              type: boolean
              description: Bypass the worthiness gate. Default false.
            project:
              type: string
              description: Optional project (sub-brain) to scope to.
            expiresAt:
              type: string
              description:
                Explicit TTL — ISO-8601 WITH timezone offset (e.g. 2026-08-14T12:00:00Z); offset-less
                strings are rejected. Past it the entry is hidden from reads and later hard-deleted.
          required:
            - content
        annotations:
          title: Remember a fact
          readOnlyHint: false
          destructiveHint: false
          idempotentHint: true
          openWorldHint: false
        x-order: 7
      operationId: postV1Remember
  /v1/context-prefix:
    get:
      summary: Cacheable observation log prefix for prompt-caching agents
      tags:
        - memory
      parameters:
        - schema:
            nullable: true
            type: string
            maxLength: 128
          in: query
          name: project
          required: false
      security:
        - UserBearer: []
        - SessionCookie: []
      responses:
        "200":
          description: Default Response
      operationId: getV1ContextPrefix
