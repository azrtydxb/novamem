  /v1/me/today:
    get:
      summary: Lightweight cross-table activity feed for the user dashboard
      tags:
        - self-service
      security:
        - SessionCookie: []
        - UserBearer: []
      responses:
        "200":
          description: Default Response
      x-mcp-tool:
        name: memory_today
        description:
          Surface what the user has worked on today. CALL THIS AT THE START OF A NEW CONVERSATION
          when the user asks "what was I doing", "where did we leave off", "recap", "what's new today",
          "catch me up" — or proactively at session start to ground yourself in the user's current focus
          before answering anything substantive. Returns the last 24 h of entries newest-first. Cheaper
          than a full search when the user's question is about *recent* state. Combine with `memory_search`
          when the question spans further back than today.
        inputSchema:
          type: object
          properties:
            namespace:
              type: string
            includeNamespaces:
              type: array
              items:
                type: string
            maxSensitivity:
              type: string
              enum:
                - public
                - internal
                - private
                - sensitive
            contentMode:
              type: string
              enum:
                - full
                - snippet
                - ids
              description:
                '"snippet" truncates content to ~240 chars (truncated: true on cut rows); "ids"
                omits content and metadata (rank first, hydrate later). Default "full".'
            k:
              type: number
            project:
              type: string
              description: Project id or name.
            includeProjects:
              type: array
              items:
                type: string
        annotations:
          title: Today's memory feed
          readOnlyHint: true
          idempotentHint: true
          openWorldHint: false
        x-order: 8
      operationId: getV1MeToday
