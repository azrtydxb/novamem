                  maxItems: 16
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 128
                    pattern: ^[a-z0-9][a-z0-9._:-]*$
                maxSensitivity:
                  type: string
                  enum:
                    - public
                    - internal
                    - private
                    - sensitive
                contentMode:
                  type: string
                  enum:
