  /.well-known/oauth-protected-resource:
    get:
      summary: OAuth 2.0 Protected Resource Metadata (RFC 9728)
      tags:
        - auth
      description:
        'Discovery document the MCP authorization flow starts from: an unauthenticated request
        to a protected route answers 401 with `WWW-Authenticate: Bearer resource_metadata="…"` pointing
        here. Public — discovery has to work before the caller holds a credential.


        novamem is an OAuth 2.1 *resource* server in shape but not in issuance: it mints its own `nm_…`
        bearers from the dashboard rather than delegating to an authorization server, so `authorization_servers`
        is deliberately absent. Naming one that cannot issue tokens for this resource would send clients
        into a flow that dead-ends.'
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  resource:
                    type: string
                  bearer_methods_supported:
                    type: array
                    items:
                      type: string
                  resource_name:
                    type: string
                  resource_documentation:
                    type: string
                required:
                  - resource
                additionalProperties: true
      operationId: getWellKnownOauthProtectedResource
