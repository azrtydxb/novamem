          have I been working on lately", "this week", "this month", "since [date]", "what changed after
          X". Pass `since` as ISO-8601 to set the lower bound; without it, returns the latest entries
          unbounded. This is the right tool when the question is *temporal*; use `memory_search` when
          the question is about a *topic*; use `memory_today` for the 24 h convenience window. All three
          are cheap — pick the one whose framing fits the user's phrasing.
