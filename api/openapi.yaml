        exists, whether a token was minted, whether anything has been remembered yet."
  /v1/admin/tokens/revoke:
    post:
      summary: Revoke a user bearer by plaintext token
      tags:
        - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  minLength: 1
                  maxLength: 256
              required:
                - token
      security:
        - SessionCookie: []
        - UserBearer: []
      responses:
        "200":
          description: revocation count
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: postV1AdminTokensRevoke
      description:
        Revoke a bearer by presenting its plaintext. The server hashes the input and deletes
        the matching row, so a token pasted from a leaked config can be killed without knowing which user
        it belongs to.
  /v1/admin/users:
    post:
      summary: Provision a user (and optionally a bearer token) non-interactively
      tags:
        - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  maxLength: 254
                  format: email
                  pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                password:
                  type: string
                  minLength: 8
                  maxLength: 256
                name:
                  type: string
                  minLength: 1
                  maxLength: 128
                tokenLabel:
                  type: string
                  maxLength: 128
                tokenScope:
                  type: string
                  enum:
                    - full
                    - read_only
                tokenExpiresInDays:
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                  maximum: 3650
              required:
                - email
                - password
      security:
        - SessionCookie: []
        - UserBearer: []
      responses:
        "200":
          description: created admin user
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: postV1AdminUsers
      description:
        Provision a user and mint their first `nm_…` bearer. The plaintext token is returned
        once and never again — it is stored only as a sha256 hash.
    get:
      summary: List every user with entry + token counts
      tags:
        - admin
      security:
        - SessionCookie: []
        - UserBearer: []
      responses:
        "200":
          description: admin user list
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: getV1AdminUsers
      description: Every dashboard user with role and creation time. Admin session or admin bearer only.
  /v1/admin/users/{id}:
    delete:
