name: Release SDK (Rust)

# Publishes clients/rust when a clients/rust/vX.Y.Z tag is pushed
# (ADR 0009: independent semver per SDK). verify runs the whole SDK
# workflow at the tag, live smoke included; publish needs it and the version check.
on:
  push:
    tags: ["clients/rust/v*"]

permissions:
  contents: read

concurrency:
  group: release-sdk-rust-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/sdk.yml

  version-matches-tag:
    runs-on: arc-azrtydxb-amd64
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: The manifest version is the tag's
        run: |
          want="${GITHUB_REF_NAME#clients/rust/v}"
          got=$(sh scripts/sdk-version.sh rust)
          [ "$got" = "$want" ] || { echo "manifest version $got, tag $want"; exit 1; }

  publish:
    needs: [verify, version-matches-tag]
    runs-on: arc-azrtydxb-amd64
    timeout-minutes: 20
    container:
      image: rust:1-bookworm
    steps:
      - uses: actions/checkout@v7
      - name: Publish the novamem crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --manifest-path clients/rust/Cargo.toml
