name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so PR pushes don't queue stale work.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write   # publish container images to ghcr.io (only on main pushes)

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/novamem

jobs:
  # ── Native test matrix ────────────────────────────────────────────────
  # One job per architecture, each on a native GitHub-hosted runner — no
  # QEMU, no cross-compile. fail-fast:false so an arm64 failure doesn't
  # cancel amd64 (and vice versa); each shows as its own status check.
  test:
    name: test (${{ matrix.arch }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build before typecheck so workspace packages that consume each
      # other's `dist/` (e.g. packages/mcp imports @azertydxb/novamem types)
      # see compiled .d.ts files.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  # ── Dependency audit (arch-agnostic, runs once) ───────────────────────
  audit:
    name: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # `pnpm audit` reads pnpm-lock.yaml directly — no install needed.
      # `--prod` so dev-only CVEs (e.g. in build tooling) don't block PRs.
      - run: pnpm audit --prod --audit-level=high

  # ── Package build (arch-agnostic JS — npm publish artefacts) ──────────
  # @azertydxb/novamem and @azertydxb/novamem-mcp are pure JS; one build covers
  # every consumer arch. Verifies `pnpm pack` produces installable tarballs
  # and uploads them as artefacts so a release workflow can pull them.
  package:
    name: package (npm)
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: pnpm pack (client + mcp + init)
        run: |
          mkdir -p dist-tarballs
          # `pnpm --filter X pack` injects --recursive which pack rejects;
          # cd into each package and pack directly instead.
          ( cd packages/client && pnpm pack --pack-destination ../../dist-tarballs )
          ( cd packages/mcp    && pnpm pack --pack-destination ../../dist-tarballs )
          ( cd packages/init   && pnpm pack --pack-destination ../../dist-tarballs )
          ls -la dist-tarballs
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs
          path: dist-tarballs/*.tgz
          if-no-files-found: error
          retention-days: 14

  # ── Docker image (native per arch) ────────────────────────────────────
  # Each arch builds on its own native runner — no buildx --platform with
  # QEMU. Trivy gates the build before it gets pushed; only main-branch
  # pushes (not PRs) end up in ghcr.io. fail-fast:false so the two arches
  # fail independently. needs:[test] gates on a green test run.
  docker:
    name: docker (${{ matrix.arch }})
    needs: [test]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # Per-arch cache scope so the two arches don't fight for the same
      # gha cache slot — each gets its own slice keyed by `${arch}`.
      - name: Build runtime image (native ${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: novamem:ci-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Trivy scan (HIGH+CRITICAL, fail on findings)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: novamem:ci-${{ matrix.arch }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      # Push only on main-branch pushes — PRs (incl. forks) build + scan
      # but never publish. Arch-suffixed tags here; the `manifest` job
      # below stitches them into a multi-arch index.
      - name: Login to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Re-run build-push-action with push:true so buildx handles
      # attestation manifests correctly. The gha cache from the previous
      # step is fully populated; this call hits cache and just pushes.
      # `docker tag` + `docker push` on the locally-loaded image trips
      # an "unknown blob" error because the loaded variant strips the
      # attestation manifests the registry expects.
      - name: Push per-arch image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}:main-${{ matrix.arch }}
            ${{ env.REGISTRY_IMAGE }}:sha-${{ steps.sha.outputs.short }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  # ── Multi-arch manifest ───────────────────────────────────────────────
  # Stitches the two per-arch images into a single multi-arch index under
  # ghcr.io/.../novamem:main (and :sha-<short>). Runs once on amd64 after
  # both per-arch docker jobs finish; only on main-branch pushes.
  manifest:
    name: manifest (multi-arch)
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Create + push :main multi-arch manifest
        run: |
          docker buildx imagetools create -t ${{ env.REGISTRY_IMAGE }}:main \
            ${{ env.REGISTRY_IMAGE }}:main-amd64 \
            ${{ env.REGISTRY_IMAGE }}:main-arm64
      - name: Create + push :sha-<short> multi-arch manifest
        run: |
          docker buildx imagetools create -t ${{ env.REGISTRY_IMAGE }}:sha-${{ steps.sha.outputs.short }} \
            ${{ env.REGISTRY_IMAGE }}:sha-${{ steps.sha.outputs.short }}-amd64 \
            ${{ env.REGISTRY_IMAGE }}:sha-${{ steps.sha.outputs.short }}-arm64
