name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      # P1-O3: catch known CVEs in dependencies. Fails on high+ severity.
      # `--prod` so dev-only CVEs (e.g. in build tooling) don't block PRs.
      - name: pnpm audit (production deps)
        run: pnpm audit --prod --audit-level=high

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: novamem:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy scan (high+critical, fail on findings)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: novamem:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
