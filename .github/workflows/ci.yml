name: CI

on:
  push:
    branches: [main]
    # Tag pushes also trigger CI so the docker job can publish semver
    # image tags (`:vX.Y.Z`, `:X.Y.Z`). Server releases are tagged
    # `vX.Y.Z` on the merge commit; without this trigger we'd only ever
    # have `:main` + `:sha-<short>` and operators couldn't pin to a
    # release version.
    tags: ["v*"]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so PR pushes don't queue stale work.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. `packages: write` is granted per-job to the
# two jobs that actually publish container images (docker, manifest)
# rather than to every job in the workflow.
permissions:
  contents: read

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/novamem

jobs:
  # ── Native test matrix ────────────────────────────────────────────────
  # CI tests run once on the amd64 ARC scale set (novanas). ARM64
  # validation happens in the Docker build job below on KW ARC, where the
  # native ARM64 image is built without QEMU/cross-compile.
  # Node versions: 20 is the `engines` floor declared in package.json; 24
  # is what release.yml publishes from and what the runtime image is
  # closest to. Testing only on 20 left a skew where code could pass CI
  # and break on the version we actually ship.
  test:
    name: test (${{ matrix.arch }}, node ${{ matrix.node }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22, not 20: Node 20 reached end of life in April 2026, and
          # @scalar/api-reference (the API-reference renderer the docs site
          # bundles) declares engines.node >= 22. The repo's own floor moved
          # with it.
          - arch: amd64
            runner: arc-azrtydxb-amd64
            node: 22
          - arch: amd64
            runner: arc-azrtydxb-amd64
            node: 24
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      # PINNED TO v4 DELIBERATELY — do not take dependabot's v6 bump.
      # v6 installs pnpm as a native binary (@pnpm/exe) which needs
      # libatomic.so.1; the self-hosted arc-azrtydxb-amd64 runner image does
      # not have it, so every job dies with "error while loading shared
      # libraries ... exits with code 127". v4 uses the JS distribution and
      # works on both hosted and self-hosted runners.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --reporter=append-only
      # Build before typecheck so workspace packages that consume each
      # other's `dist/` see compiled .d.ts files.
      - run: pnpm build
      - run: pnpm typecheck
      # ESLint over the repo's JavaScript. TypeScript is excluded until
      # typescript-eslint supports TS 7 (typescript-eslint#10940) — the
      # config switches it on automatically when it does.
      - run: pnpm lint
      - run: pnpm test
      # Guard against stale prose drift in docs (issue #73). Cheap regex
      # checks; no extra deps. See scripts/doc-smoke.mjs for invariants.
      - run: pnpm docs:smoke

  # ── Go modules (server rewrite + shared client) ───────────────────────
  go:
    name: go (build + vet + test)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: |
            go/go.sum
            clients/go/go.sum
      - run: cd go && go build ./... && go vet ./... && go test ./...
      # -count=1 on the client module: routecoverage_test.go reads
      # ../../docs/api/openapi.json, a file OUTSIDE its own module, and Go's
      # test cache did not treat that as an input. #279 removed two routes
      # from the document and left their routeMap entries behind; this step
      # reported success on a stale cached result and main went red without
      # anyone being told. Caching a drift guard defeats the guard.
      - run: cd clients/go && go build ./... && go vet ./... && go test -count=1 ./...
      # Both Go modules are lint-clean and stay that way.
      - run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run ./...
        working-directory: clients/go
      - run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run ./...
        working-directory: go
      # The black-box oracle (ADR 0003). Without NOVAMEM_URL every case
      # skips, so CI still compiles it, vets it, and runs the
      # import-boundary check that keeps it independent of go/.
      - run: go build ./... && go vet ./... && go test ./...
        working-directory: conformance
      # api/openapi.yaml is the contract. Everything else — the served
      # document, the MCP tool surface, the route list the mux is checked
      # against, and the tool catalogue in the docs — is generated from
      # it. Regenerate and diff: an edit to any output without an edit to
      # the source fails here.
      #
      # go/internal/config/registry.go is the same thing for the
      # environment surface: it declares every variable the server reads,
      # the loader takes its defaults from it, and the reference page in
      # docs/install/ is rendered from it. The page carried a
      # hand-written table until then, and it had drifted far enough to
      # be undeployable.
      - run: cd go && go run ./cmd/gen-contract && go run ./cmd/gen-tool-docs && go run ./cmd/gen-env-docs
      - run: git diff --exit-code api/ docs/api/ docs/install/env-reference.md .env.example conformance/reference/ go/internal/mcp/tooldefs.json go/internal/httpapi/openapi.json go/internal/httpapi/routes_gen.go go/internal/agentskill/skill go/internal/initcli/assets

  # ── Dependency audit (arch-agnostic, runs once) ───────────────────────
  audit:
    name: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # `pnpm audit` reads pnpm-lock.yaml directly — no install needed.
      # `--prod` so dev-only CVEs (e.g. in build tooling) don't block PRs.
      - run: pnpm audit --prod --audit-level=high

  # ── Package build (npm) ───────────────────────────────────────────────
  # npm publishing is retired: the three publishable packages (client,
  # mcp, init) were superseded by Go binaries and deleted, and every
  # remaining workspace package is private. Nothing is left to pack.
  #
  # The job is kept — with its name unchanged — ONLY because
  # `package (npm)` is a required status check on main. Deleting it would
  # leave every PR waiting forever for a check that never reports. Remove
  # the required check in branch protection, then delete this job.
  package:
    name: package (npm)
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Confirm nothing is publishable
        run: node scripts/assert-nothing-publishable.mjs

  # ── Docker image (native per arch) ────────────────────────────────────
  # Each arch builds on its own native runner — amd64 on novanas ARC,
  # arm64 on KW ARC. No buildx --platform with QEMU. Trivy gates the build before it gets pushed; only main-branch
  # pushes (not PRs) end up in ghcr.io. fail-fast:false so the two arches
  # fail independently. needs:[go, test] gates on BOTH suites: the binary
  # is Go, but the admin dashboard it embeds is built from
  # packages/admin-ui, so a red Node suite must not publish an image.
  docker:
    name: docker (${{ matrix.arch }})
    permissions:
      contents: read
      packages: write # publish container images to ghcr.io
    needs: [go, test]
    # 45, not 20. The build+push step alone measured 787s (13 min) on a
    # cache MISS — and a miss is the normal case after any commit that
    # touches the Go tree, because PR builds are cache-from only (no
    # cache-to, deliberately, so an untrusted PR cannot poison the shared
    # Zot cache) and therefore only main populates it. At 20 minutes both
    # arches raced the limit: arm64 squeezed in at ~14.5 min while amd64
    # was cancelled at exactly 20:00 on three consecutive main pushes,
    # which is why main ended up with no published image at all. A warm
    # cache finishes the same build in ~2 min, so this ceiling only ever
    # applies to the cold path.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: arc-azrtydxb-amd64-publish
          - arch: arm64
            runner: arc-azrtydxb-publish
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
        with:
          # The in-cluster Nexus cache registry serves a cert from the
          # kw-cluster-internal CA; BuildKit runs in its own container and
          # doesn't inherit the host's trust store, so cache-from/cache-to
          # need this or they die with "x509: certificate signed by
          # unknown authority".
          buildkitd-config-inline: |
            [registry."192.168.10.131"]
              insecure = true
            # Base image pulls, not just the cache. BuildKit's
            # docker-container driver runs in its own container and ignores
            # the node's containerd registries.yaml, so without these the
            # Dockerfile's node:, golang: and gcr.io/distroless images come
            # straight from the internet even though Nexus proxies all three.
            # Keeps the pulls on the LAN and off Docker Hub's rate limits.
            [registry."docker.io"]
              mirrors = ["192.168.10.131"]
            [registry."gcr.io"]
              mirrors = ["192.168.10.131"]
      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # Strip the leading `v` off a tag ref to derive the bare semver.
      # Empty when the trigger isn't a tag push — both forms (`v1.1.6`
      # and `1.1.6`) get tagged so operators can use either.
      - name: Compute semver tag
        id: semver
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          REF="${GITHUB_REF#refs/tags/}"
          echo "v=${REF}"        >> "$GITHUB_OUTPUT"   # vX.Y.Z
          echo "bare=${REF#v}"   >> "$GITHUB_OUTPUT"   # X.Y.Z
      # PRs build + scan locally without publishing. Push/tag events build
      # and publish exactly once, then scan the pushed arch image. This avoids
      # the previous duplicate ARM64 BuildKit run that could exceed the ARC
      # job window after a successful native build.
      - name: Build runtime image for PR scan (native ${{ matrix.arch }})
        if: github.event_name != 'push' || (github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v'))
        uses: docker/build-push-action@v7
        with:
          context: .
          file: go/Dockerfile
          push: false
          load: true
          tags: novamem:ci-${{ matrix.arch }}
          # Registry cache on the in-cluster Nexus: the gha cache backend
          # round-trips to GitHub over the internet from these LAN runners
          # and evicts at 10GB; Nexus is one switch-hop away.
          # Read-only for PR builds: no cache-to here, so an untrusted
          # pull_request build can never write to (poison) the shared
          # cache tag that main/tag builds consume. Only the trusted
          # push-event step below seeds the cache.
          # No login either: Nexus serves this repository to anonymous
          # readers, so a fork PR — which gets no secrets — still gets a
          # warm cache instead of failing on an empty credential.
          cache-from: type=registry,ref=192.168.10.131/azrtydxb/novamem-buildcache:${{ matrix.arch }}
      - name: Trivy scan local PR image (HIGH+CRITICAL, fail on findings)
        if: github.event_name != 'push' || (github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v'))
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          # mirror.gcr.io (the action's default DB mirror) serves
          # persistent 404s during Google artifact-cache incidents and
          # fails every build. List the canonical registries as
          # fallbacks so one registry outage can't block CI.
          TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-java-db:1,public.ecr.aws/aquasecurity/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1
        with:
          image-ref: novamem:ci-${{ matrix.arch }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Login to ghcr.io
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Writing the cache needs a credential; reading it does not. Scoped
      # to the push path for the same reason cache-to is: a pull_request
      # build must never be able to write to the shared cache.
      - name: Login to the Nexus cache registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        # Non-blocking. The build cache is an optimisation; publishing the
        # image is the job's purpose, and the two must not share a fate.
        # When this step was allowed to fail the job, a rejected Nexus
        # credential aborted main BEFORE the build ran, so main published
        # nothing at all — strictly worse than the broken cache it was
        # meant to fix.
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          registry: 192.168.10.131
          username: ${{ secrets.NEXUS_USER }}
          password: ${{ secrets.NEXUS_PASSWORD }}
      - name: Build and push per-arch image to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/build-push-action@v7
        with:
          context: .
          file: go/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}:sha-${{ steps.sha.outputs.short }}-${{ matrix.arch }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:main-{1}', env.REGISTRY_IMAGE, matrix.arch) || '' }}
            ${{ steps.semver.outputs.v && format('{0}:{1}-{2}', env.REGISTRY_IMAGE, steps.semver.outputs.v, matrix.arch) || '' }}
            ${{ steps.semver.outputs.bare && format('{0}:{1}-{2}', env.REGISTRY_IMAGE, steps.semver.outputs.bare, matrix.arch) || '' }}
          # Registry cache on the in-cluster Nexus: the gha cache backend
          # round-trips to GitHub over the internet from these LAN runners
          # and evicts at 10GB; Nexus is one switch-hop away.
          cache-from: type=registry,ref=192.168.10.131/azrtydxb/novamem-buildcache:${{ matrix.arch }}
          # ignore-error: an unreachable, unwritable or unauthenticated
          # cache degrades this to a cold build (~13 min per arch instead
          # of ~2 min warm). Without it the export is FATAL, which is how
          # a retired cache registry left main red for two commits while
          # the per-arch images sat published and the manifest job — which
          # `needs: [docker]` — never ran, so no multi-arch tag existed to
          # deploy.
          cache-to: type=registry,ref=192.168.10.131/azrtydxb/novamem-buildcache:${{ matrix.arch }},mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true
      - name: Trivy scan pushed image (HIGH+CRITICAL, fail on findings)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_PLATFORM: linux/${{ matrix.arch }}
          # Same DB fallbacks as the PR-scan step above.
          TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-java-db:1,public.ecr.aws/aquasecurity/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1
        with:
          image-ref: ${{ env.REGISTRY_IMAGE }}:sha-${{ steps.sha.outputs.short }}-${{ matrix.arch }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  # ── Multi-arch manifest ───────────────────────────────────────────────
  # Stitches the two per-arch GHCR images into single multi-arch indexes.
  manifest:
    name: manifest (multi-arch)
    needs: [docker]
    permissions:
      contents: read
      packages: write # push the multi-arch manifest to ghcr.io
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: docker/setup-buildx-action@v4
      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Compute semver tag
        id: semver
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          REF="${GITHUB_REF#refs/tags/}"
          echo "v=${REF}"      >> "$GITHUB_OUTPUT"
          echo "bare=${REF#v}" >> "$GITHUB_OUTPUT"
      # `:sha-<short>` is published on every triggering ref so operators
      # can pin reproducibly regardless of whether they're following
      # `:main` or a release tag.
      - name: Create + push :sha-<short> multi-arch manifest
        run: |
          docker buildx imagetools create -t ${{ env.REGISTRY_IMAGE }}:sha-${{ steps.sha.outputs.short }} \
            ${{ env.REGISTRY_IMAGE }}:sha-${{ steps.sha.outputs.short }}-amd64 \
            ${{ env.REGISTRY_IMAGE }}:sha-${{ steps.sha.outputs.short }}-arm64
      - name: Create + push :main multi-arch manifest
        if: github.ref == 'refs/heads/main'
        run: |
          docker buildx imagetools create -t ${{ env.REGISTRY_IMAGE }}:main \
            ${{ env.REGISTRY_IMAGE }}:main-amd64 \
            ${{ env.REGISTRY_IMAGE }}:main-arm64
      - name: Create + push :v<X.Y.Z> multi-arch manifest
        if: steps.semver.outputs.v
        run: |
          docker buildx imagetools create -t ${{ env.REGISTRY_IMAGE }}:${{ steps.semver.outputs.v }} \
            ${{ env.REGISTRY_IMAGE }}:${{ steps.semver.outputs.v }}-amd64 \
            ${{ env.REGISTRY_IMAGE }}:${{ steps.semver.outputs.v }}-arm64
      - name: Create + push :<X.Y.Z> multi-arch manifest
        if: steps.semver.outputs.bare
        run: |
          docker buildx imagetools create -t ${{ env.REGISTRY_IMAGE }}:${{ steps.semver.outputs.bare }} \
            ${{ env.REGISTRY_IMAGE }}:${{ steps.semver.outputs.bare }}-amd64 \
            ${{ env.REGISTRY_IMAGE }}:${{ steps.semver.outputs.bare }}-arm64
