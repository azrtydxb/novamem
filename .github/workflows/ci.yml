name: CI

on:
  push:
    branches: [main]
    # Tag pushes also trigger CI so the docker job can publish semver
    # image tags (`:vX.Y.Z`, `:X.Y.Z`). Server releases are tagged
    # `vX.Y.Z` on the merge commit; without this trigger we'd only ever
    # have `:main` + `:sha-<short>` and operators couldn't pin to a
    # release version.
    tags: ['v*']
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so PR pushes don't queue stale work.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write   # publish container images to ghcr.io (only on main pushes)

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/novamem

jobs:
  # ── Native test matrix ────────────────────────────────────────────────
  # One job per architecture, each on a native runner — amd64 on GitHub-hosted,
  # arm64 on the KW ARC runner. No QEMU, no cross-compile. fail-fast:false so an arm64 failure doesn't
  # cancel amd64 (and vice versa); each shows as its own status check.
  test:
    name: test (${{ matrix.arch }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: arc-azrtydxb
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile --reporter=append-only
      # Build before typecheck so workspace packages that consume each
      # other's `dist/` (e.g. packages/mcp imports @azrtydxb/novamem types)
      # see compiled .d.ts files.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      # Guard against schema.ts ↔ migrations/ drift. Fails if someone
      # edited the schema without committing a paired migration.
      - run: pnpm --filter @azrtydxb/novamem-server db:check
      # Guard against stale prose drift in docs (issue #73). Cheap regex
      # checks; no extra deps. See scripts/doc-smoke.mjs for invariants.
      - run: pnpm docs:smoke

  # ── Dependency audit (arch-agnostic, runs once) ───────────────────────
  audit:
    name: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      # `pnpm audit` reads pnpm-lock.yaml directly — no install needed.
      # `--prod` so dev-only CVEs (e.g. in build tooling) don't block PRs.
      - run: pnpm audit --prod --audit-level=high

  # ── Package build (arch-agnostic JS — npm publish artefacts) ──────────
  # @azrtydxb/novamem and @azrtydxb/novamem-mcp are pure JS; one build covers
  # every consumer arch. Verifies `pnpm pack` produces installable tarballs
  # and uploads them as artefacts so a release workflow can pull them.
  package:
    name: package (npm)
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile --reporter=append-only
      - run: pnpm -r build
      - name: pnpm pack (client + mcp + init)
        run: |
          mkdir -p dist-tarballs
          # `pnpm --filter X pack` injects --recursive which pack rejects;
          # cd into each package and pack directly instead.
          ( cd packages/client && pnpm pack --pack-destination ../../dist-tarballs )
          ( cd packages/mcp    && pnpm pack --pack-destination ../../dist-tarballs )
          ( cd packages/init   && pnpm pack --pack-destination ../../dist-tarballs )
          ls -la dist-tarballs
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs
          path: dist-tarballs/*.tgz
          if-no-files-found: error
          retention-days: 14

  # ── Docker image (native per arch) ────────────────────────────────────
  # Each arch builds on its own native runner — amd64 on GitHub-hosted,
  # arm64 on KW ARC. No buildx --platform with QEMU. Trivy gates the build before it gets pushed; only main-branch
  # pushes (not PRs) end up in ghcr.io. fail-fast:false so the two arches
  # fail independently. needs:[test] gates on a green test run.
  docker:
    name: docker (${{ matrix.arch }})
    needs: [test]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: arc-azrtydxb
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # Strip the leading `v` off a tag ref to derive the bare semver.
      # Empty when the trigger isn't a tag push — both forms (`v1.1.6`
      # and `1.1.6`) get tagged so operators can use either.
      - name: Compute semver tag
        id: semver
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          REF="${GITHUB_REF#refs/tags/}"
          echo "v=${REF}"        >> "$GITHUB_OUTPUT"   # vX.Y.Z
          echo "bare=${REF#v}"   >> "$GITHUB_OUTPUT"   # X.Y.Z
      # Per-arch cache scope so the two arches don't fight for the same
      # gha cache slot — each gets its own slice keyed by `${arch}`.
      - name: Build runtime image (native ${{ matrix.arch }})
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: novamem:ci-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Trivy scan (HIGH+CRITICAL, fail on findings)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: novamem:ci-${{ matrix.arch }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      # Push only on main-branch pushes — PRs (incl. forks) build + scan
      # but never publish. Arch-suffixed tags here; the `manifest` job
      # below stitches them into a multi-arch index.
      - name: Login to ghcr.io
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Push only on main-branch pushes OR vX.Y.Z tag pushes — PRs
      # build + scan but never publish. Arch-suffixed tags here; the
      # `manifest` job below stitches them into multi-arch indexes.
      #
      # Tag set:
      #   :sha-<short>-<arch>          — always pushed
      #   :main-<arch>                 — main-branch pushes only
      #   :v<X.Y.Z>-<arch>             — tag pushes only (e.g. v1.1.6)
      #   :<X.Y.Z>-<arch>              — tag pushes only (e.g. 1.1.6)
      #
      # `tags:` is newline-separated; empty lines are ignored, so
      # interpolating a falsy value just drops the line.
      #
      # Re-runs build-push-action with push:true so buildx handles
      # attestation manifests correctly. The gha cache from the build
      # step is fully populated; this call hits cache and just pushes.
      # `docker tag` + `docker push` on the locally-loaded image trips
      # an "unknown blob" error because the loaded variant strips the
      # attestation manifests the registry expects.
      - name: Push per-arch image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}:sha-${{ steps.sha.outputs.short }}-${{ matrix.arch }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:main-{1}', env.REGISTRY_IMAGE, matrix.arch) || '' }}
            ${{ steps.semver.outputs.v && format('{0}:{1}-{2}', env.REGISTRY_IMAGE, steps.semver.outputs.v, matrix.arch) || '' }}
            ${{ steps.semver.outputs.bare && format('{0}:{1}-{2}', env.REGISTRY_IMAGE, steps.semver.outputs.bare, matrix.arch) || '' }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  # ── Multi-arch manifest ───────────────────────────────────────────────
  # Stitches the two per-arch images into single multi-arch indexes.
  # Runs once on amd64 after both per-arch docker jobs finish, on either
  # a main-branch push (publishes :main + :sha-<short>) or a vX.Y.Z tag
  # push (publishes :v<X.Y.Z> + :<X.Y.Z> + :sha-<short>).
  manifest:
    name: manifest (multi-arch)
    needs: [docker]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Compute semver tag
        id: semver
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          REF="${GITHUB_REF#refs/tags/}"
          echo "v=${REF}"      >> "$GITHUB_OUTPUT"
          echo "bare=${REF#v}" >> "$GITHUB_OUTPUT"
      # `:sha-<short>` is published on every triggering ref so operators
      # can pin reproducibly regardless of whether they're following
      # `:main` or a release tag.
      - name: Create + push :sha-<short> multi-arch manifest
        run: |
          docker buildx imagetools create -t ${{ env.REGISTRY_IMAGE }}:sha-${{ steps.sha.outputs.short }} \
            ${{ env.REGISTRY_IMAGE }}:sha-${{ steps.sha.outputs.short }}-amd64 \
            ${{ env.REGISTRY_IMAGE }}:sha-${{ steps.sha.outputs.short }}-arm64
      - name: Create + push :main multi-arch manifest
        if: github.ref == 'refs/heads/main'
        run: |
          docker buildx imagetools create -t ${{ env.REGISTRY_IMAGE }}:main \
            ${{ env.REGISTRY_IMAGE }}:main-amd64 \
            ${{ env.REGISTRY_IMAGE }}:main-arm64
      - name: Create + push :v<X.Y.Z> multi-arch manifest
        if: steps.semver.outputs.v
        run: |
          docker buildx imagetools create -t ${{ env.REGISTRY_IMAGE }}:${{ steps.semver.outputs.v }} \
            ${{ env.REGISTRY_IMAGE }}:${{ steps.semver.outputs.v }}-amd64 \
            ${{ env.REGISTRY_IMAGE }}:${{ steps.semver.outputs.v }}-arm64
      - name: Create + push :<X.Y.Z> multi-arch manifest
        if: steps.semver.outputs.bare
        run: |
          docker buildx imagetools create -t ${{ env.REGISTRY_IMAGE }}:${{ steps.semver.outputs.bare }} \
            ${{ env.REGISTRY_IMAGE }}:${{ steps.semver.outputs.bare }}-amd64 \
            ${{ env.REGISTRY_IMAGE }}:${{ steps.semver.outputs.bare }}-arm64
