name: SDKs

# The nine language SDKs (ADR 0009) and the contract they share. Each SDK
# gets its own job here as it lands; `generated` gates them all. go/** is
# a trigger too: sdk-smoke runs every SDK against the server this PR builds.
on:
  pull_request:
    paths:
      [
        "clients/**",
        "go/**",
        "api/**",
        "docs/api/**",
        "go.work",
        ".github/workflows/sdk.yml",
      ]
  push:
    branches: [main]
    paths:
      [
        "clients/**",
        "go/**",
        "api/**",
        "docs/api/**",
        "go.work",
        ".github/workflows/sdk.yml",
      ]

concurrency:
  group: sdk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The generator's own tests. Every SDK's wire types are generated from
  # docs/api/openapi.json and clients/contract/routes.json and checked in.
  generated:
    runs-on: arc-azrtydxb-amd64
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          # clients/gen and clients/contract are stdlib-only: no go.sum to key a cache on.
          cache: false
      - run: cd clients/gen && go vet ./... && go test -count=1 ./...
      # The smoke module's own tests; its live schema check skips (loudly)
      # here and runs in sdk-smoke.
      - run: cd clients/smoke && go vet ./... && go test -count=1 ./...
      # The Java template names google-java-format as its formatter (the
      # layout depends on line length, so no template can match it alone).
      # Pinned to the version contributors get from Homebrew: a different
      # release may lay lines out differently and fail the check below.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: google-java-format 1.36.1
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/gjf.jar" \
            https://github.com/google/google-java-format/releases/download/v1.36.1/google-java-format-1.36.1-all-deps.jar
          printf '#!/bin/sh\nexec java -jar "%s" "$@"\n' "$RUNNER_TEMP/gjf.jar" > "$RUNNER_TEMP/bin/google-java-format"
          chmod +x "$RUNNER_TEMP/bin/google-java-format"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Regenerate every SDK's types and compare with what is checked in: an
      # API change that was not regenerated fails here, naming each file.
      - run: go run ./clients/gen -spec docs/api/openapi.json -routes clients/contract/routes.json -out clients -check

  # Python SDK (plan Task 7): the shared scenario suite, sync and async, on
  # the oldest and newest supported Pythons. Go builds the scenario server.
  python:
    needs: [generated]
    runs-on: arc-azrtydxb-amd64
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Scenario suite
        working-directory: clients/python
        run: PYTHONPATH=src:tests python -m unittest discover -s tests -v
      - name: Installs with no dependencies
        run: |
          python -m venv "$RUNNER_TEMP/nm"
          "$RUNNER_TEMP/nm/bin/pip" install -q ./clients/python
          extra=$("$RUNNER_TEMP/nm/bin/pip" list --format=freeze | grep -v -E '^(pip|setuptools|novamem)==' || true)
          if [ -n "$extra" ]; then echo "unexpected runtime dependencies: $extra"; exit 1; fi

  # TypeScript SDK (plan Task 8): the shared scenario suite on the oldest
  # and newest supported Node, and a package with no runtime dependencies.
  typescript:
    needs: [generated]
    runs-on: arc-azrtydxb-amd64
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Scenario suite
        working-directory: clients/typescript
        run: npm ci && npm test
      - name: Publishes with no runtime dependencies
        working-directory: clients/typescript
        run: |
          npm run build
          node -e 'process.exit(require("./package.json").dependencies ? 1 : 0)'
          npm pack --dry-run --json | node -e 'const p=JSON.parse(require("fs").readFileSync(0))[0]; const bad=p.files.filter(f=>!(f.path.startsWith("dist/")||["package.json","README.md"].includes(f.path))); if (bad.length) { console.error("unexpected files:", bad.map(f=>f.path)); process.exit(1) }'

  # Rust SDK (plan Task 11): the shared scenario suite on the MSRV and on
  # stable, from the committed lockfile. The C/C++ SDK builds on this crate.
  rust:
    needs: [generated]
    runs-on: arc-azrtydxb-amd64
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.80", "1"]
    # The official image brings the linker the ARC runner lacks.
    container:
      image: rust:${{ matrix.rust }}-bookworm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false
      - name: Scenario suite
        working-directory: clients/rust
        run: cargo test --locked
      - name: Lint
        if: matrix.rust == '1'
        working-directory: clients/rust
        run: rustup component add clippy && cargo clippy --locked --all-targets -- -D warnings
      - name: Runtime dependencies are the five ADR 0009 allows
        working-directory: clients/rust
        run: |
          got=$(cargo tree --locked --depth 1 -e normal --prefix none | sed 1d | awk '{print $1}' | sort -u | tr '\n' ' ')
          want="reqwest serde serde_json thiserror tokio "
          [ "$got" = "$want" ] || { echo "runtime dependencies: $got (want $want)"; exit 1; }

  # C and C++ SDK (plan Task 12): both scenario runners over the Rust
  # crate's C ABI, then the C runner again under valgrind. In a container so
  # valgrind installs without sudo (the ARC runners run containers: #306).
  c:
    needs: [rust]
    runs-on: arc-azrtydxb-amd64
    timeout-minutes: 30
    container:
      image: rust:1-bookworm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false
      - run: apt-get update -qq && apt-get install -y -qq valgrind python3
      - name: Scenario suite (C11 and C++17)
        working-directory: clients/c
        run: make test
      - name: No leaks (valgrind)
        working-directory: clients/c
        run: make memcheck

  # Ruby SDK (plan Task 13): the shared scenario suite on the oldest
  # supported Ruby, with warnings on; the gem loads with no gems installed.
  ruby:
    needs: [generated]
    runs-on: arc-azrtydxb-amd64
    timeout-minutes: 15
    # ruby/setup-ruby needs /opt/hostedtoolcache, which the ARC runner does
    # not let it create; the official image brings Ruby, rake and minitest.
    container:
      image: ruby:3.2-bookworm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false
      - name: Scenario suite
        working-directory: clients/ruby
        run: rake test
      - name: Loads with no gems installed
        working-directory: clients/ruby
        run: GEM_HOME="$RUNNER_TEMP/nogems" GEM_PATH="$RUNNER_TEMP/nogems" ruby -Ilib -e 'require "novamem"'

  # PHP SDK (plan Task 14): the shared scenario suite on the oldest and a
  # current PHP; nothing but platform extensions outside require-dev.
  php:
    needs: [generated]
    runs-on: arc-azrtydxb-amd64
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.4"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          tools: composer
      - name: Scenario suite
        working-directory: clients/php
        # The ARC runners' egress to repo.packagist.org drops the odd
        # connection (curl error 7 after a few ms), so the install retries.
        run: |
          for i in 1 2 3; do
            composer install --no-interaction --no-progress && break
            [ "$i" = 3 ] && exit 1
            sleep 10
          done
          vendor/bin/phpunit
      - name: Static analysis
        working-directory: clients/php
        run: vendor/bin/phpstan analyse --no-progress
      - name: No runtime dependencies
        working-directory: clients/php
        run: |
          rm -rf vendor && composer install --no-dev --no-interaction --no-progress
          [ -z "$(composer show --no-dev)" ] || { composer show --no-dev; exit 1; }

  # Swift SDK (plan Task 15): the shared scenario suite on Linux, on the
  # floor and a current Swift, in the official images (Linux only, by
  # decision: Apple platforms are not exercised in CI).
  swift:
    needs: [generated]
    runs-on: arc-azrtydxb-amd64
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        swift: ["5.9-jammy", "6.3-noble"]
    container:
      image: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false
      - name: Scenario suite
        working-directory: clients/swift
        run: swift test
      - name: No dependencies
        working-directory: clients/swift
        run: swift package show-dependencies | tee /dev/stderr | grep -q "No external dependencies found"

  # .NET SDK (plan Task 9): the shared scenario suite on .NET 8, in the
  # official SDK image (no toolchain install on the ARC runner).
  dotnet:
    needs: [generated]
    runs-on: arc-azrtydxb-amd64
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/dotnet/sdk:8.0
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false
      - name: Scenario suite
        working-directory: clients/dotnet
        run: dotnet test tests/Novamem.Tests
      - name: No package references
        working-directory: clients/dotnet
        run: |
          out=$(dotnet list src/Novamem/Novamem.csproj package)
          echo "$out"
          echo "$out" | grep -q "has no package references\|No packages were found"
      - name: Smoke program builds
        working-directory: clients/dotnet
        run: dotnet build smoke

  # Java SDK (plan Task 10): the shared scenario suite plus the transport
  # tests on the Java 17 floor and the current LTS. The maven images carry
  # both toolchains; the runner has no Maven.
  java:
    needs: [generated]
    runs-on: arc-azrtydxb-amd64
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21"]
    container:
      image: maven:3.9-eclipse-temurin-${{ matrix.java }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false
      - name: Scenario suite
        working-directory: clients/java
        run: mvn -B verify
      - name: Runtime dependencies are Jackson only
        working-directory: clients/java
        run: |
          mvn -B -q dependency:tree -Dscope=runtime -DoutputType=text -DoutputFile=deps.txt
          cat deps.txt
          ! grep -v -E '^com\.azrtydxb:novamem|com\.fasterxml\.jackson\.core:jackson-(databind|core|annotations):' deps.txt
      - name: Smoke program runs
        working-directory: clients/java
        run: |
          mvn -B -q dependency:build-classpath -Dmdep.outputFile=cp.txt
          NOVAMEM_SMOKE_URL=http://127.0.0.1:1 NOVAMEM_SMOKE_TOKEN=nm_x \
            java -cp "$(cat cp.txt):target/classes:target/test-classes" com.azrtydxb.novamem.Smoke down

  # Live smoke (plan Task 16): every SDK against a server built from this
  # PR. The server, the token minter and the embeddings stand-in are built
  # once here, statically, and run inside each language's own image below.
  sdk-smoke-build:
    needs: [python, typescript, dotnet, java, rust, c, ruby, php, swift]
    runs-on: arc-azrtydxb-amd64
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false
      - name: Build server, mint and embed
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p smoke-bin
          (cd go && go build -o ../smoke-bin/novamem-server ./cmd/novamem-server)
          (cd clients/smoke && go build -o ../../smoke-bin/mint ./cmd/mint && go build -o ../../smoke-bin/embed ./cmd/embed)
      - uses: actions/upload-artifact@v7
        with:
          name: smoke-bin
          path: smoke-bin/
          retention-days: 1

  # One leg per SDK, in the image its own job uses (the Ruby, PHP and Swift
  # setup actions do not work on the ARC runners), plus the schema leg that
  # checks live responses against docs/api/openapi.json.
  sdk-smoke:
    needs: [sdk-smoke-build]
    runs-on: arc-azrtydxb-amd64
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lang: python, image: "python:3.13-bookworm" }
          - { lang: typescript, image: "node:24-bookworm" }
          - { lang: dotnet, image: "mcr.microsoft.com/dotnet/sdk:8.0" }
          - { lang: java, image: "maven:3.9-eclipse-temurin-21" }
          - { lang: rust, image: "rust:1-bookworm" }
          - { lang: c, image: "rust:1-bookworm" }
          - { lang: ruby, image: "ruby:3.2-bookworm" }
          - { lang: php, image: "composer:2" }
          - { lang: swift, image: "swift:6.3-noble" }
          - { lang: schema, image: "golang:1.26-bookworm" }
    container:
      image: ${{ matrix.image }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: novamem
          POSTGRES_PASSWORD: novamem
          POSTGRES_DB: novamem
        options: >-
          --health-cmd "pg_isready -U novamem"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      NOVAMEM_SMOKE_URL: http://127.0.0.1:7778
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: smoke-bin
          path: smoke-bin
      - run: chmod +x smoke-bin/*
      - name: Build the SDK (before the server starts)
        if: matrix.lang != 'schema'
        run: sh clients/smoke/run.sh ${{ matrix.lang }} build
      - name: Start embed and the server
        env:
          NOVAMEM_WARM_URL: postgres://novamem:novamem@postgres:5432/novamem?sslmode=disable
          NOVAMEM_COLD_PROVIDER: pgvector
          NOVAMEM_EMBEDDINGS_PROVIDER: openai-compatible
          NOVAMEM_EMBEDDINGS_ENDPOINT: http://127.0.0.1:7779/v1
          NOVAMEM_EMBEDDINGS_MODEL: smoke-hash
          NOVAMEM_AUTH_MODE: user
          NOVAMEM_COOKIE_SECRET: sdk-smoke-cookie-secret-0123456789
          NOVAMEM_BOOTSTRAP_ADMIN_EMAIL: smoke-admin@example.com
          NOVAMEM_BOOTSTRAP_ADMIN_PASSWORD: smoke-admin-password
          NOVAMEM_INSECURE_COOKIES: "1"
          NOVAMEM_PORT: "7778"
          NOVAMEM_BASE_URL: http://127.0.0.1:7778
        run: |
          nohup smoke-bin/embed -addr 127.0.0.1:7779 > "$RUNNER_TEMP/embed.log" 2>&1 &
          nohup smoke-bin/novamem-server > "$RUNNER_TEMP/server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/server.pid"
      - name: Mint tokens
        run: |
          ADMIN=$(smoke-bin/mint -wait 90s -email smoke-admin@example.com -password smoke-admin-password)
          echo "::add-mask::$ADMIN"
          echo "NOVAMEM_SMOKE_ADMIN_TOKEN=$ADMIN" >> "$GITHUB_ENV"
          USER_TOKEN=$(smoke-bin/mint -label sdk-smoke-user -email smoke-admin@example.com -password smoke-admin-password)
          echo "::add-mask::$USER_TOKEN"
          echo "NOVAMEM_SMOKE_TOKEN=$USER_TOKEN" >> "$GITHUB_ENV"
      - name: Live schema check
        if: matrix.lang == 'schema'
        run: go test -count=1 -v -run TestResponsesMatchSchemas ./clients/smoke/...
      - name: Smoke up
        if: matrix.lang != 'schema'
        run: sh clients/smoke/run.sh ${{ matrix.lang }} up
      - name: Stop the server
        if: matrix.lang != 'schema'
        # The job container's PID 1 does not reap children, so an exited
        # server lingers as a zombie: that counts as stopped (its socket is
        # closed). Anything else after 30 s fails the step.
        run: |
          pid=$(cat "$RUNNER_TEMP/server.pid")
          kill "$pid"
          for _ in $(seq 1 30); do
            state=$(sed -n 's/^State:[[:space:]]*\(.\).*/\1/p' "/proc/$pid/status" 2>/dev/null || true)
            case "$state" in "" | Z) exit 0 ;; esac
            sleep 1
          done
          echo "server $pid still running (state $state)"
          exit 1
      - name: Smoke down
        if: matrix.lang != 'schema'
        run: sh clients/smoke/run.sh ${{ matrix.lang }} down
      - name: Server log
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/server.log" "$RUNNER_TEMP/embed.log"
