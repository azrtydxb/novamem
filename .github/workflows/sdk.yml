name: SDKs

# The nine language SDKs (ADR 0009) and the contract they share. Each SDK
# gets its own job here as it lands; `generated` gates them all.
on:
  pull_request:
    paths:
      [
        "clients/**",
        "api/**",
        "docs/api/**",
        "go.work",
        ".github/workflows/sdk.yml",
      ]
  push:
    branches: [main]
    paths:
      [
        "clients/**",
        "api/**",
        "docs/api/**",
        "go.work",
        ".github/workflows/sdk.yml",
      ]

concurrency:
  group: sdk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The generator's own tests. Every SDK's wire types are generated from
  # docs/api/openapi.json and clients/contract/routes.json and checked in.
  generated:
    runs-on: arc-azrtydxb-amd64
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          # clients/gen and clients/contract are stdlib-only: no go.sum to key a cache on.
          cache: false
      - run: cd clients/gen && go vet ./... && go test -count=1 ./...
      # The -check step lands with the first language template (#309): with
      # no template it would check nothing, and the generator now refuses that.
