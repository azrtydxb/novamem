# Deploys site/ to GitHub Pages on every push to main that touches it,
# plus a manual trigger. Uses the official actions/configure-pages →
# upload-pages-artifact → deploy-pages chain so we don't need a separate
# gh-pages branch.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Only one Pages deploy at a time; cancel earlier runs in flight rather
# than queueing them — a stale build serves nothing useful.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
