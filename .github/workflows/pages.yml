# Deploys site/ to GitHub Pages on every push to main that touches it,
# plus a manual trigger. Uses the official actions/configure-pages →
# upload-pages-artifact → deploy-pages chain so we don't need a separate
# gh-pages branch.
#
# Two artifacts get combined into one Pages deploy:
#   1. site/index.html (+ static assets)  — the marketing landing page
#   2. packages/docs-site/.vitepress/dist — the VitePress docs, built into site/docs/
#
# So the final upload is the entire site/ directory.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "packages/docs-site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Node + pnpm so we can build VitePress. The pnpm version is read
      # from package.json's `packageManager` field — passing `version`
      # here too would conflict with action-setup@v4.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build VitePress docs
        run: pnpm --filter @azrtydxb/novamem-docs-site build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
