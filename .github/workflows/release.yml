name: Release

# Tag-driven npm publish for the three public packages:
#   @azrtydxb/novamem        (TypeScript client)
#   @azrtydxb/novamem-mcp    (stdio shim)
#   @azrtydxb/novamem-init   (auto-installer)
#
# Trigger: push a tag matching v* (e.g. `git tag v0.2.0 && git push --tags`).
# Each publishable package's package.json `version` field must already be set
# to that version — the workflow doesn't bump for you. Run `pnpm changeset`
# or edit by hand, commit, then tag.
#
# Auth: npm Trusted Publishers (OIDC) — no token, no secret to rotate.
# Each of the three packages has a trusted publisher configured on npmjs.com
# linking it to this workflow file (release.yml) on this repo. `npm publish`
# detects it's running inside GitHub Actions, swaps an OIDC token from the
# `id-token: write` permission, and the registry validates the binding.
#
# Provenance: each `npm publish --provenance` attaches a Sigstore attestation
# tying the tarball to this exact workflow run + commit. Shows up as the
# green "Built and signed by GitHub Actions" badge on npmjs.com. Requires
# `id-token: write` and `publishConfig.provenance: true` in each package.json
# (already set). With trusted publishing, this is the only auth we need.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (run `npm publish --dry-run`, don't actually publish)"
        type: boolean
        default: false

permissions:
  contents: write   # for `gh release create`
  id-token: write   # for npm provenance attestations

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm test
      - name: Publish @azrtydxb/novamem
        run: |
          cd packages/client
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --access public --provenance --dry-run
          else
            npm publish --access public --provenance
          fi
      - name: Publish @azrtydxb/novamem-mcp
        run: |
          cd packages/mcp
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --access public --provenance --dry-run
          else
            npm publish --access public --provenance
          fi
      - name: Publish @azrtydxb/novamem-init
        run: |
          cd packages/init
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --access public --provenance --dry-run
          else
            npm publish --access public --provenance
          fi
      - name: GitHub release notes
        if: ${{ !inputs.dry_run }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
