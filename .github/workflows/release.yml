name: Release

# Per-package npm publish driven by Changesets.
#
# Flow:
#   1. PR adds `.changeset/<slug>.md` describing what changed and which
#      packages bump (patch / minor / major). Run `pnpm changeset` to
#      generate one. The file is committed alongside the change.
#   2. On every push to `main`, the changesets action looks for unconsumed
#      `.changeset/*.md` files. If any exist, it opens (or updates) a
#      "Version Packages" PR that bumps the affected package.json
#      versions, regenerates per-package CHANGELOGs, and deletes the
#      consumed changeset files.
#   3. When that "Version Packages" PR is merged, this same workflow runs
#      with no pending changesets — the action then runs `pnpm publish
#      -r --provenance` which only publishes packages whose package.json
#      version doesn't yet exist on npm. So one merge = N publishes
#      (only the changed packages).
#
# Auth: npm Trusted Publishers (OIDC) only. Each of the three publishable
# packages has a TP binding on npmjs.com pointing at this workflow file.
# Node 24 ships npm 11.x which does the OIDC handshake for the publish
# PUT itself — Node ≤ 22 ships npm 10.x where TP only works for Sigstore
# provenance signing and the publish silently 404s.
#
# Provenance: --provenance attaches a Sigstore attestation tying each
# tarball to this exact workflow run + commit. Requires `id-token: write`
# and `publishConfig.provenance: true` in each package.json (already set).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write       # for the "Version Packages" PR that the action opens
  pull-requests: write  # same
  id-token: write       # for npm Trusted Publishers + Sigstore provenance

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: changesets release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Releases run only from main. Without this guard a workflow_dispatch
    # from a feature branch could open a Version Packages PR or attempt
    # to publish from non-canonical state.
    if: github.ref == 'refs/heads/main'
    # `NPM_CONFIG_PROVENANCE` makes `npm publish` (which `pnpm changeset
    # publish` invokes per package) attach a Sigstore attestation. The
    # `--provenance` CLI flag isn't pluggable through the changesets
    # action; the env var is the documented way to flip it on globally.
    env:
      NPM_CONFIG_PROVENANCE: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          # Node 24 ships npm 11.x — required for Trusted Publishers OIDC
          # to authenticate the publish PUT (npm 10 only does OIDC for
          # provenance signing and the publish silently 404s).
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm test
      # `version` consumes pending .changeset/*.md and bumps affected
      # package.json versions. `publish` calls `npm publish` per package,
      # which skips versions already on the registry. Provenance attaches
      # via `NPM_CONFIG_PROVENANCE=true` set at the job level above.
      - name: Version + publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
