version: 2
updates:
  # Root + all four packages share a single pnpm-lock; one ecosystem entry
  # at the workspace root is enough.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # Patch + minor bumps batched per package.
      patch-and-minor:
        update-types: ["patch", "minor"]
    ignore:
      # Major bumps that need integration testing — review individually.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
      - dependency-name: "drizzle-orm"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2

  # The language SDKs (ADR 0009), one entry per manifest.
  - package-ecosystem: "pip"
    directory: "/clients/python"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
  - package-ecosystem: "npm"
    directory: "/clients/typescript"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
  - package-ecosystem: "nuget"
    directory: "/clients/dotnet"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
  - package-ecosystem: "maven"
    directory: "/clients/java"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
  - package-ecosystem: "cargo"
    directory: "/clients/rust"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
  - package-ecosystem: "cargo"
    directory: "/clients/c/novamem-ffi"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
  - package-ecosystem: "bundler"
    directory: "/clients/ruby"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
  - package-ecosystem: "composer"
    directory: "/clients/php"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
  - package-ecosystem: "swift"
    directory: "/clients/swift"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
  - package-ecosystem: "gomod"
    directory: "/clients/contract"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
  - package-ecosystem: "gomod"
    directory: "/clients/gen"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
  - package-ecosystem: "gomod"
    directory: "/clients/smoke"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
