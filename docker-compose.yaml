services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: novamem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: novamem
    ports:
      - "5432:5432"
    volumes:
      - novamem_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novamem"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
    volumes:
      - novamem_qdrant:/qdrant/storage
    healthcheck:
      # The qdrant image has no curl/wget, but it does ship bash — which
      # can open a TCP socket via /dev/tcp. Enough to know the HTTP port
      # is accepting connections.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  novamem:
    build:
      context: .
      dockerfile: go/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      # Wait for readiness, not just for the container to exist. With
      # `service_started` the app could boot before Qdrant accepted
      # requests, and (before the graph store learned to reconnect) a
      # FalkorDB that was merely slow to start left the graph tier
      # disabled until the app was restarted.
      qdrant:
        condition: service_healthy
    environment:
      NOVAMEM_WARM_URL: postgres://novamem:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/novamem
      # For pgvector instead of qdrant: set NOVAMEM_COLD_PROVIDER=pgvector,
      # REMOVE this NOVAMEM_COLD_URL line (it falls back to the warm DB),
      # switch postgres to image pgvector/pgvector:pg16, and add
      # `shm_size: 512mb` to the postgres service.
      NOVAMEM_COLD_URL: http://qdrant:6333
      NOVAMEM_EMBEDDINGS_PROVIDER: local-transformers
      NOVAMEM_AUTH_MODE: ${NOVAMEM_AUTH_MODE:-user}
      NOVAMEM_ADMIN_DASHBOARD: ${NOVAMEM_ADMIN_DASHBOARD:-1}
      NOVAMEM_BOOTSTRAP_ADMIN_EMAIL: ${NOVAMEM_BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      NOVAMEM_BOOTSTRAP_ADMIN_PASSWORD: ${NOVAMEM_BOOTSTRAP_ADMIN_PASSWORD:?Set NOVAMEM_BOOTSTRAP_ADMIN_PASSWORD in .env}
      NOVAMEM_COOKIE_SECRET: ${NOVAMEM_COOKIE_SECRET}
      # Local-dev only: serves cookies over plain HTTP. Strip in production.
      NOVAMEM_INSECURE_COOKIES: ${NOVAMEM_INSECURE_COOKIES:-1}
      NOVAMEM_PORT: "7778"
    ports:
      # 7778 on both sides — same number host + container so logs and URLs
      # match. macOS AirPlay Receiver squats on 5000, hence the off-default.
      - "7778:7778"

volumes:
  novamem_pg:
  novamem_qdrant:
  novamem_falkor:
