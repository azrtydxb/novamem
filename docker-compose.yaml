services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: novamem
      POSTGRES_PASSWORD: novamem
      POSTGRES_DB: novamem
    ports:
      - "5432:5432"
    volumes:
      - novamem_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novamem"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
    volumes:
      - novamem_qdrant:/qdrant/storage

  falkordb:
    image: falkordb/falkordb:edge
    ports:
      - "6379:6379"
    volumes:
      - novamem_falkor:/data

  novamem:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      falkordb:
        condition: service_started
    environment:
      NOVAMEM_WARM_URL: postgres://novamem:novamem@postgres:5432/novamem
      NOVAMEM_COLD_URL: http://qdrant:6333
      NOVAMEM_GRAPH_URL: redis://falkordb:6379
      NOVAMEM_EMBEDDINGS_PROVIDER: local-transformers
      NOVAMEM_AUTH_MODE: ${NOVAMEM_AUTH_MODE:-user}
      NOVAMEM_ADMIN_DASHBOARD: ${NOVAMEM_ADMIN_DASHBOARD:-1}
      NOVAMEM_BOOTSTRAP_ADMIN_EMAIL: ${NOVAMEM_BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      NOVAMEM_BOOTSTRAP_ADMIN_PASSWORD: ${NOVAMEM_BOOTSTRAP_ADMIN_PASSWORD:-novaflow}
      NOVAMEM_COOKIE_SECRET: ${NOVAMEM_COOKIE_SECRET}
      # Local-dev only: serves cookies over plain HTTP. Strip in production.
      NOVAMEM_INSECURE_COOKIES: ${NOVAMEM_INSECURE_COOKIES:-1}
      NOVAMEM_PORT: "7778"
    ports:
      # 7778 on both sides — same number host + container so logs and URLs
      # match. macOS AirPlay Receiver squats on 5000, hence the off-default.
      - "7778:7778"

volumes:
  novamem_pg:
  novamem_qdrant:
  novamem_falkor:
