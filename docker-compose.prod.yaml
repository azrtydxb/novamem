# Production override for docker-compose.yaml.
#
# Usage:
#   docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d
#
# This override hardens the dev-friendly base file for real deployments:
#   - Datastore host ports (postgres 5432, qdrant 6333)
#     are removed so those services stay reachable only on the internal
#     compose network.
#   - The novamem app port (7778) is NOT published here either: production
#     deployments are expected to sit behind a TLS-terminating reverse
#     proxy (Caddy, Traefik, nginx, …) on the same docker network. See
#     docs/install/docker.md for the pattern.
#   - Session cookies are forced back to Secure-only.
#
# Anything not overridden here (volumes, healthchecks, env wiring) is
# inherited from docker-compose.yaml.

services:
  postgres:
    ports: !reset []

  qdrant:
    ports: !reset []

  novamem:
    ports: !reset []
    environment:
      # The base compose file defaults NOVAMEM_INSECURE_COOKIES to 1 so
      # that `docker compose up` works over plain HTTP on localhost.
      # Inheriting that default in production would emit session cookies
      # without the Secure attribute: the browser holds an HTTPS session
      # (TLS terminates at the reverse proxy) but will also send the
      # cookie over any plain-HTTP request to the same host, which is
      # exactly the window an SSL-strip / MITM attack needs. Production
      # pins it off — set it explicitly in `.env` only if you know you
      # are terminating TLS somewhere this file can't see.
      NOVAMEM_INSECURE_COOKIES: "0"
