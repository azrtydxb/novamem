<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>NovaMem · Grid direction</title>
<meta name="viewport" content="width=1920" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  #root { min-height: 100vh; }
  .nm-frame { width: 100%; height: 100%; overflow: hidden; }
  .nm-frame > div { width: 100%; height: 100%; overflow: hidden; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="direction-grid.jsx"></script>

<script type="text/babel">
  function Frame({ children, w, h, scale = 1 }) {
    return (
      <div style={{ width: w * scale, height: h * scale, position: "relative", background: "#fff", overflow: "hidden", borderRadius: 4 }}>
        <div style={{ width: w, height: h, transform: `scale(${scale})`, transformOrigin: "top left", position: "absolute", top: 0, left: 0 }}>
          {children}
        </div>
      </div>
    );
  }

  function App() {
    const W = 1280, H = 800, AUTH_W = 1100, AUTH_H = 720;
    const scale = 0.7;
    const App = window.Grid.GrApp;
    const SignIn = window.Grid.GrSignIn;
    const Onb = window.Grid.GrOnboarding;
    const modes = [{ key: "light", dark: false, label: "Light" }, { key: "dark", dark: true, label: "Dark" }];

    return (
      <DesignCanvas>
        <DCSection id="hero" title="Metrics — hero dashboard" subtitle="Cross-tenant for admin · scoped for end-user">
          {modes.map(m => ([
            <DCArtboard key={`${m.key}-user`} id={`hero-${m.key}-user`} label={`User · ${m.label}`} width={W*scale} height={H*scale}>
              <div className="nm-frame"><Frame w={W} h={H} scale={scale}><App dark={m.dark} role="user" initial="metrics" /></Frame></div>
            </DCArtboard>,
            <DCArtboard key={`${m.key}-admin`} id={`hero-${m.key}-admin`} label={`Admin · ${m.label}`} width={W*scale} height={H*scale}>
              <div className="nm-frame"><Frame w={W} h={H} scale={scale}><App dark={m.dark} role="admin" initial="metrics" /></Frame></div>
            </DCArtboard>
          ]))}
        </DCSection>

        <DCSection id="auth" title="Auth & onboarding" subtitle="Sign-in + first-run">
          {modes.map(m => ([
            <DCArtboard key={`${m.key}-signin`} id={`auth-${m.key}-signin`} label={`Sign in · ${m.label}`} width={AUTH_W*scale} height={AUTH_H*scale}>
              <div className="nm-frame"><Frame w={AUTH_W} h={AUTH_H} scale={scale}><SignIn dark={m.dark} /></Frame></div>
            </DCArtboard>,
            <DCArtboard key={`${m.key}-onb`} id={`auth-${m.key}-onb`} label={`Onboarding · ${m.label}`} width={AUTH_W*scale} height={AUTH_H*scale}>
              <div className="nm-frame"><Frame w={AUTH_W} h={AUTH_H} scale={scale}><Onb dark={m.dark} /></Frame></div>
            </DCArtboard>
          ]))}
        </DCSection>

        <DCSection id="ws" title="User workspace" subtitle="Browse · Graph · Today · Projects · Tokens">
          {modes.map(m => (
            [["browse","Browse"],["graph","Graph"],["today","Today"],["projects","Projects"],["tokens","Tokens"]].map(([s,l]) => (
              <DCArtboard key={`${m.key}-${s}`} id={`ws-${m.key}-${s}`} label={`${l} · ${m.label}`} width={W*scale} height={H*scale}>
                <div className="nm-frame"><Frame w={W} h={H} scale={scale}><App dark={m.dark} role="user" initial={s} /></Frame></div>
              </DCArtboard>
            ))
          ))}
        </DCSection>

        <DCSection id="admin" title="Admin operations" subtitle="Health · Tenants · Users (cross-tenant)">
          {modes.map(m => (
            [["health","Health"],["tenants","Tenants"],["users","Users"]].map(([s,l]) => (
              <DCArtboard key={`${m.key}-${s}`} id={`admin-${m.key}-${s}`} label={`${l} · ${m.label}`} width={W*scale} height={H*scale}>
                <div className="nm-frame"><Frame w={W} h={H} scale={scale}><App dark={m.dark} role="admin" initial={s} /></Frame></div>
              </DCArtboard>
            ))
          ))}
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
